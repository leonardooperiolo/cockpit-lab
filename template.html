/* ---------- área técnica (prazo de entrega) ---------- */
/* Mesma lógica do relatório "Previsões de Entrega" do CONCENT: setor -> requisição
   (paciente) -> exames daquela requisição naquele setor, numerados em ordem (1,2,3...),
   igual ao relatório em PDF. A mesma requisição pode aparecer em mais de um setor
   (cada um só com os exames daquele setor). */
function atISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function atHojeISO(){return atISO(new Date());}
S.at={q:'',vista:'and',aberto:'',pg:0,de:'',ate:'',sts:{t:true,col:true,dp:true,d:true,c:false},exa:new Set()};
const AT_PAGE=25;
const AT_STATUS={col:'Coletado',t:'Triado',dp:'Digitado Parcial',d:'Digitado',c:'Conferido'};
function atBR(iso){ if(!iso)return ''; const [a,m,d]=iso.split('-'); return `${d}/${m}/${a}`; }
function atHay(r){ return r._h||(r._h=normTxt([r.paciente,r.exame,r.cod,r.req,r.setor].join(' '))); }
/* lista de exames (código + nome) pra alimentar o filtro multiselect-com-busca, igual
   o autofiltro do Excel que o Leo mandou de exemplo */
function atExamesDisponiveis(){
  const AT=D.areaTecnica, vistos=new Map();
  [...AT.rows,...AT.aguardandoColeta].forEach(r=>{if(!vistos.has(r.cod))vistos.set(r.cod,r.exame);});
  return [...vistos.entries()].map(([cod,nome])=>({i:cod,label:`${cod} — ${nome}`})).sort((a,b)=>a.i.localeCompare(b.i));
}
function atRows(){
  const AT=D.areaTecnica, base=S.at.vista==='agu'?AT.aguardandoColeta:AT.rows;
  const qs=normTxt(S.at.q).trim(), tk=qs.split(/\s+/).filter(Boolean);
  let rows=base;
  if(S.at.exa.size) rows=rows.filter(r=>S.at.exa.has(r.cod));
  if(S.at.vista==='and'){
    rows=rows.filter(r=>S.at.sts[r.status]);
    if(S.at.de) rows=rows.filter(r=>r.prazo==null||r.prazo>=S.at.de);
    if(S.at.ate) rows=rows.filter(r=>r.prazo==null||r.prazo<=S.at.ate);
  }else{
    if(S.at.de) rows=rows.filter(r=>r.entrada==null||r.entrada>=S.at.de);
    if(S.at.ate) rows=rows.filter(r=>r.entrada==null||r.entrada<=S.at.ate);
  }
  if(tk.length) rows=rows.filter(r=>{const h=atHay(r);return tk.every(t=>h.includes(t));});
  return rows;
}
/* nomes de todos os setores que existem para a vista/status/exame/busca atuais, ignorando o filtro de datas
   (assim um setor sem nada atrasado/para hoje continua aparecendo na tela inicial, só que com 0) */
function atSetoresTodos(){
  const AT=D.areaTecnica, base=S.at.vista==='agu'?AT.aguardandoColeta:AT.rows;
  const qs=normTxt(S.at.q).trim(), tk=qs.split(/\s+/).filter(Boolean);
  let rows=base;
  if(S.at.exa.size) rows=rows.filter(r=>S.at.exa.has(r.cod));
  if(S.at.vista==='and') rows=rows.filter(r=>S.at.sts[r.status]);
  if(tk.length) rows=rows.filter(r=>{const h=atHay(r);return tk.every(t=>h.includes(t));});
  return [...new Set(rows.map(r=>r.setor))];
}
/* agrupa em setor -> requisição(fil+req) -> exames (ordenados por EXASEQ, numerados 1,2,3... na exibição) */
function atAgrupar(rows){
  const agu=S.at.vista==='agu';
  const urg=g=>agu?Math.min(...g.exames.map(e=>e.entrada||'9999')):Math.min(...g.exames.map(e=>e.horasRestantes==null?1e15:e.horasRestantes));
  const temAtraso=g=>!agu&&g.exames.some(e=>e.atrasado);
  const bySetor=new Map();
  rows.forEach(r=>{
    if(!bySetor.has(r.setor))bySetor.set(r.setor,new Map());
    const reqs=bySetor.get(r.setor), k=r.fil+'|'+r.req;
    if(!reqs.has(k))reqs.set(k,{setor:r.setor,fil:r.fil,req:r.req,paciente:r.paciente,exames:[]});
    reqs.get(k).exames.push(r);
  });
  const setores=[...bySetor.entries()].map(([setor,reqsMap])=>{
    const reqs=[...reqsMap.values()];
    reqs.forEach(g=>g.exames.sort((a,b)=>(a.seq||0)-(b.seq||0)));
    reqs.sort((a,b)=>(temAtraso(b)-temAtraso(a))||(urg(a)-urg(b)));
    const atrasados=reqs.reduce((n,g)=>n+g.exames.filter(e=>e.atrasado).length,0);
    const total=reqs.reduce((n,g)=>n+g.exames.length,0);
    return {setor,reqs,total,atrasados};
  });
  setores.sort((a,b)=>b.atrasados-a.atrasados||b.total-a.total||(normTxt(a.setor)<normTxt(b.setor)?-1:1));
  return setores;
}
/* bolinha colorida com "faltam Nd" / "Hoje" / "Xh atrasado" - mesmas cores do resto do painel */
function atPillInfo(e){
  if(e.prazo==null)return null;
  const hojeStr=atHojeISO();
  if(e.atrasado){
    const h=Math.abs(e.horasRestantes);
    return {cls:'venc',txt:(h<24?`${Math.floor(h)}h`:`${Math.floor(h/24)}d`)+' atrasado'};
  }
  if(e.prazo===hojeStr) return {cls:e.horasRestantes<=3?'warn':'ok',txt:'Hoje'};
  const dias=Math.max(1,Math.round((new Date(e.prazo+'T00:00:00')-new Date(hojeStr+'T00:00:00'))/86400000));
  return {cls:'ok',txt:`faltam ${dias}d`};
}
function atExameLinha(e){
  const agu=S.at.vista==='agu';
  const mut='color:#94a3b8;font-size:11.5px'; // igual ao .cdg, mas sem depender do contexto .aptb (aqui o card fica dentro da tabela de setores)
  const rotulo=`<code>${esc(e.cod)}</code>${agu?'':` <span style="${mut}">(${esc(AT_STATUS[e.status]||e.status)})</span>`}`;
  let direita;
  if(agu){
    direita=`<span style="margin-left:22px;${mut}">aguardando desde ${atBR(e.entrada)}</span>`;
  }else{
    const pill=atPillInfo(e);
    const dataPill=e.prazo?`<span class="pill" style="margin-left:22px">${atBR(e.prazo)}</span>`:`<span style="margin-left:22px;${mut}">sem prazo</span>`;
    direita=dataPill+(pill?`<span class="pill ${pill.cls}" style="margin-left:8px">${esc(pill.txt)}</span>`:'');
  }
  return `<li style="margin-bottom:5px;white-space:nowrap;overflow-x:auto">${rotulo} — ${esc(e.exame)}${direita}</li>`;
}
// data de entrada da requisição no laboratório (a mais antiga entre os exames dela) e a
// filial onde foi cadastrada - no mesmo formato de "pílula" da data de prazo dos exames
function atReqInfo(g){
  const ents=g.exames.map(e=>e.entrada).filter(Boolean).sort(),fil=g.exames.length?g.exames[0].fil:null;
  const nomeFil=fil==null?'':((D.filiais&&D.filiais[String(fil)])||('Filial '+fil));
  return (ents.length?`<span class="pill pill-ent" style="margin-left:22px" title="Entrada no laboratório">Entrada ${atBR(ents[0])}</span>`:'')
        +(nomeFil?`<span class="pill pill-fil" style="margin-left:8px" title="Filial do cadastro">${esc(nomeFil)}</span>`:'');
}
function atRenderGrupos(reqs,mostrarSetor){
  return reqs.map(g=>{
    const temAtraso=g.exames.some(e=>e.atrasado);
    return `<div class="card" style="margin-bottom:8px${temAtraso?';border-left:4px solid #b3261e':''}">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px">
        <div><b style="font-size:15px">${esc(g.paciente)}</b><span style="margin-left:22px;font-size:15px"><b>Requisição <code style="font-size:15px">${esc(g.req)}</code></b></span>${atReqInfo(g)}${mostrarSetor?` <span class="tag">${esc(g.setor)}</span>`:''}</div>
      </div>
      <ol style="margin:6px 0 0;padding-left:22px">${g.exames.map(atExameLinha).join('')}</ol></div>`;
  }).join('');
}
function atPaginar(lista,container,mostrarSetor){
  const n=lista.length,pgs=Math.max(1,Math.ceil(n/AT_PAGE));
  if(!n){$(container).innerHTML='<div class="empty" style="margin:0">Nenhuma requisição neste setor com os filtros atuais.</div>';return;}
  S.at.pg=Math.min(S.at.pg,pgs-1);
  const ini=S.at.pg*AT_PAGE,vis=lista.slice(ini,ini+AT_PAGE);
  let h=atRenderGrupos(vis,mostrarSetor!==false);
  if(pgs>1)h+=`<div class="row" style="margin:10px 0 0"><button class="btn" data-at-pg="-1" ${S.at.pg?'':'disabled'}>← Anterior</button><span class="sub" style="margin:0">Página ${S.at.pg+1} de ${pgs} · requisições ${fNum.format(ini+1)} a ${fNum.format(Math.min(n,ini+AT_PAGE))} de ${fNum.format(n)}</span><button class="btn" data-at-pg="1" ${S.at.pg<pgs-1?'':'disabled'}>Próxima →</button></div>`;
  $(container).innerHTML=h;
  $$('[data-at-pg]').forEach(b=>b.onclick=()=>{S.at.pg+=+b.dataset.atPg;renderAreaTecnica();$('#atBar').scrollIntoView({block:'start'});});
}
function renderAreaTecnica(){
  const rows=atRows(), qs=normTxt(S.at.q).trim();
  if(qs){
    // busca ativa: lista de requisições de todos os setores
    const setores=atAgrupar(rows);
    const reqs=setores.flatMap(s=>s.reqs);
    const n=reqs.length;
    let h=`<p class="sub" style="margin:10px 0 6px">${fNum.format(n)} ${n===1?'requisição':'requisições'} para “${esc(qs)}”</p>`;
    if(!n){h+='<div class="empty">Nenhuma requisição encontrada com estes filtros.</div>';$('#atRes').innerHTML=h;return;}
    $('#atRes').innerHTML=h+'<div id="atGrupos"></div>';
    atPaginar(reqs,'#atGrupos');
    return;
  }
  // nenhuma busca: lista de setores, com drill-down em acordeão (abre embaixo do próprio setor, sem precisar voltar)
  const agrupados=atAgrupar(rows);
  const nomesTodos=atSetoresTodos();
  const extras=nomesTodos.filter(n=>!agrupados.some(s=>s.setor===n)).map(n=>({setor:n,reqs:[],total:0,atrasados:0}));
  const setores=[...agrupados,...extras].sort((a,b)=>b.atrasados-a.atrasados||b.total-a.total||(normTxt(a.setor)<normTxt(b.setor)?-1:1));
  let h=`<p class="sub" style="margin:10px 0 6px">${fNum.format(setores.reduce((n,s)=>n+s.total,0))} exames em ${fNum.format(setores.length)} setores · clique num setor para ver as requisições e os pacientes</p>`;
  if(!setores.length){$('#atRes').innerHTML=h+'<div class="empty">Nada por aqui com estes filtros.</div>';return;}
  h+=`<div class="card tw"><table class="aptb keep"><thead><tr><th class="nm">Setor</th><th class="pc">Exames</th><th class="pc st">Atrasados</th></tr></thead><tbody>`;
  setores.forEach(s=>{
    const aberto=S.at.aberto===s.setor;
    h+=`<tr class="atSetorRow" data-at-abrir="${esc(s.setor)}" style="cursor:pointer${aberto?';background:#eef4ff':''}"><td class="nm">${aberto?'▾':'▸'} ${esc(s.setor)}</td><td class="pc">${fNum.format(s.total)}</td><td class="pc st">${s.atrasados?`<span class="pv" style="color:#b3261e">${fNum.format(s.atrasados)}</span>`:'<span class="mut">0</span>'}</td></tr>`;
    if(aberto)h+=`<tr><td colspan="3" style="padding:4px 0 16px;background:#f7f9fc"><div id="atGrupos"></div></td></tr>`;
  });
  h+='</tbody></table></div>';
  $('#atRes').innerHTML=h;
  $$('[data-at-abrir]').forEach(tr=>tr.onclick=()=>{
    const s=tr.dataset.atAbrir;
    S.at.aberto=(S.at.aberto===s)?'':s;
    S.at.pg=0;
    renderAreaTecnica();
  });
  if(S.at.aberto){
    const g=setores.find(s=>s.setor===S.at.aberto);
    if(g)atPaginar(g.reqs,'#atGrupos',false);
  }
}
function viewAreaTecnica(){
  const AT=D.areaTecnica;
  if(!AT)return `<div class="notice warn"><b>Ainda não há dados da área técnica.</b> Rode o <code>coletar_area_tecnica.py</code> na VM e envie os 3 CSVs para a pasta <code>data/area_tecnica</code> do repositório.</div>`;
  if(!S.at.de){const h=new Date(),d=new Date(h);d.setDate(d.getDate()-75);S.at.de=atISO(d);S.at.ate=atISO(h);}
  const R=AT.resumo,c=R.porStatus;
  // faixa colorida no topo de cada card, na mesma cor do número (mesmo padrão das outras telas)
  const k=(l,v,s,cor,faixa)=>`<div class="card kpi" style="border-top:4px solid ${faixa||cor||'var(--ink)'}"><div class="l">${l}</div><div class="v" style="font-size:58px;color:${cor||'var(--ink)'}">${v}</div><div class="s">${s||''}</div></div>`;
  const dentroPrazo=R.emAndamento-R.atrasados;
  const porStatusCard=`<div class="card kpi" style="border-top:4px solid var(--blue)"><div class="l">Por status</div><div class="at-status-grid">
    <div><div class="n">${fNum.format(c.col)}</div><div class="t">Exames em Coletado</div></div>
    <div><div class="n">${fNum.format(c.t)}</div><div class="t">Exames em Triado</div></div>
    <div><div class="n">${fNum.format(c.dp)}</div><div class="t">Exames Dig. Parc.</div></div>
    <div><div class="n">${fNum.format(c.d)}</div><div class="t">Exames Digitado</div></div>
  </div></div>`;
  let h=`<div class="kpis at-kpis">${k('Exames em andamento',fNum.format(dentroPrazo),'Exames dentro do prazo e em análise pelo setor técnico','var(--ink)','#475569')}${k('Exames em atraso '+ajuda('Exames com prazo de entrega vencido que já estão no setor técnico (triados, digitados ou digitados em parte). Os só coletados não entram aqui.'),fNum.format(R.atrasadosSemColetado),'Exames com prazo vencido com amostra no setor técnico','#b3261e')}
    ${k('Cadastrados e não coletados',fNum.format(R.aguardandoColeta),'Cadastros sem coleta do material e entrada no setor técnico','var(--amber)')}
    ${porStatusCard}</div>`;
  h+=`<div class="apbar" id="atBar" style="justify-content:center">
    <label class="fld" style="flex:0 0 auto">Mostrar<select id="atVista"><option value="and">Em andamento (${fNum.format(R.emAndamento)})</option><option value="agu">Aguardando coleta (${fNum.format(R.aguardandoColeta)})</option></select></label>
    <label class="fld" style="flex:1 1 240px">Buscar paciente, exame ou requisição<input type="search" id="atQ" placeholder="Nome do paciente, exame, requisição..." autocomplete="off" style="width:100%;font:inherit;font-size:15px;border:1px solid #cfdaee;border-radius:9px;padding:8px 12px;height:40px;background:#fff"></label>
    <label class="fld">De<input type="date" id="atDe" style="font:inherit;font-size:15px;border:1px solid #cfdaee;border-radius:9px;padding:8px 10px;height:40px;background:#fff"></label>
    <label class="fld">Até<input type="date" id="atAte" style="font:inherit;font-size:15px;border:1px solid #cfdaee;border-radius:9px;padding:8px 10px;height:40px;background:#fff"></label>
    <div class="fld" style="flex:1 1 220px">Exame<div id="atExameSel"></div></div></div>
    <div class="apbar" id="atStatusFld" style="margin-top:8px;justify-content:center">${Object.entries(AT_STATUS).filter(([k])=>k!=='c').map(([k,t])=>`<label style="display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:600;color:var(--ink)"><input type="checkbox" class="atSts" data-k="${k}" ${S.at.sts[k]?'checked':''} style="width:17px;height:17px"> ${t}</label>`).join('')}</div>
<div id="atRes"></div>`;
  return h;
}
function bindAreaTecnica(){
  if(!D.areaTecnica)return;
  const q=$('#atQ'),vista=$('#atVista'),de=$('#atDe'),ate=$('#atAte');
  q.value=S.at.q; vista.value=S.at.vista; de.value=S.at.de; ate.value=S.at.ate;
  $('#atStatusFld').style.display=S.at.vista==='agu'?'none':'';
  let t=null; q.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{S.at.q=q.value;S.at.pg=0;renderAreaTecnica();},120);};
  vista.onchange=()=>{S.at.vista=vista.value;S.at.pg=0;S.at.aberto='';$('#atStatusFld').style.display=S.at.vista==='agu'?'none':'';renderAreaTecnica();};
  de.onchange=()=>{S.at.de=de.value;S.at.pg=0;renderAreaTecnica();};
  ate.onchange=()=>{S.at.ate=ate.value;S.at.pg=0;renderAreaTecnica();};
  $$('.atSts').forEach(cb=>cb.onchange=()=>{S.at.sts[cb.dataset.k]=cb.checked;S.at.pg=0;renderAreaTecnica();});
  multi($('#atExameSel'),{set:S.at.exa,all:'Todos os exames',onChange:()=>{S.at.pg=0;renderAreaTecnica();},items:atExamesDisponiveis()});
  renderAreaTecnica();
}

/* ---------- roteamento ---------- */
const VIEWS={geral:[viewGeral,bindGeral],anual:[viewAnual,bindAnual],periodos:[viewPeriodos,bindPeriodos],rank:[viewRank,bindRank],medalertas:[viewMedAlertas,null],tat:[viewTat,bindTat],pacientes:[viewPacientes,bindPacientes],exames:[viewExames,bindExames],saude:[viewSaude,bindSaude],apoio:[viewApoio,bindApoio],areaTecnica:[viewAreaTecnica,bindAreaTecnica],precosconv:[viewPrecosConv,bindPrecosConv],margem:[viewMargem,bindMargem],qualidade:[viewQualidade,null],finGeral:[viewFinanceiro,bindFinanceiro],finPagar:[viewFinPagar,bindFinPagar],finReceber:[viewFinReceber,bindFinReceber],finDRE:[viewFinDRE,bindFinDRE]};
const GROUPS={geral:{tabs:['geral'],lbl:{geral:'Visão Diária'}},
  saude:{tabs:['saude','pacientes','medalertas'],lbl:{saude:'Visão Geral',pacientes:'Pacientes novos',medalertas:'Médicos (alertas)'}},
  apoio:{tabs:['apoio'],lbl:{apoio:'Laboratório de Apoio'}},
  areaTecnica:{tabs:['areaTecnica','tat'],lbl:{areaTecnica:'Exames em andamento',tat:'Tempo de entrega'}},
  fat:{tabs:['anual','periodos','exames','rank'],lbl:{anual:'Comparativo Anual',periodos:'Comparar Períodos',exames:'Setores',rank:'Convênios e Médicos'}},
  custos:{tabs:['margem','precosconv'],lbl:{margem:'Margem por Convênio',precosconv:'Preços por Convênio'}},
  // tela técnica (conferência dos arquivos): fora do menu, abre pelo link "Configurações" no topo
  config:{tabs:['qualidade'],lbl:{qualidade:'Qualidade dos Dados'}},
  financeiro:{tabs:['finGeral','finPagar','finReceber','finDRE'],lbl:{finGeral:'Vencimentos',finPagar:'Contas a Pagar',finReceber:'Contas a Receber',finDRE:'Demonstrativos de Resultado'}}};
const tabToGroup=Object.fromEntries(Object.entries(GROUPS).flatMap(([g,o])=>o.tabs.map(t=>[t,g])));
function go(){
  const curGroup=tabToGroup[S.tab]||'fat';
  $$('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.group===curGroup));
  const grp=GROUPS[curGroup];
  if(grp.tabs.length>1){
    $('#subtabs').style.display='';
    $('#subtabs').innerHTML=grp.tabs.map(t=>`<button role="tab" data-sub="${t}" aria-selected="${t===S.tab}">${grp.lbl[t]}</button>`).join('');
    $$('#subtabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.sub;go();});
  }else{
    $('#subtabs').style.display='none';$('#subtabs').innerHTML='';
  }
  const per=['geral','rank','exames','anual'].includes(S.tab);
  const temData=!!(S.ano||S.mes||S.ini||S.fim);$('#fgPeriodo').style.display=(per&&S.tab!=='geral'&&(S.fData||temData))?'':'none';$('#fData').style.display=per?'':'none';$('#fData').setAttribute('aria-pressed',S.fData||temData);
  $('#fgAtalhos').style.display=S.tab==='geral'?'none':'';
  $('#fgMedico').style.display=(S.tab==='geral'||S.tab==='medalertas')?'none':'';
  $('#fgAtalhos').style.display=(S.tab==='geral'||S.tab==='medalertas')?'none':'';
  $('#filters').style.display=(S.tab==='tat'||S.tab==='pacientes'||S.tab==='margem'||S.tab==='qualidade'||S.tab==='apoio'||S.tab==='areaTecnica'||S.tab==='precosconv'||S.tab==='saude'||S.tab==='finGeral'||S.tab==='finPagar'||S.tab==='finReceber'||S.tab==='finDRE')?'none':'';
  $('#fHint').textContent=per?'':S.tab==='medalertas'?'Esta aba usa sempre os últimos 30 dias. Unidade e convênio continuam valendo.':(S.tab==='anual'?'Nesta aba os anos são escolhidos no próprio painel. Unidade, convênio e médico continuam valendo.':'Nesta aba os períodos são escolhidos no próprio painel. Unidade, convênio e médico continuam valendo.');
  syncFilters();
  const [v,b]=VIEWS[S.tab];
  $('#view').innerHTML=v();
  $$('.hs[data-end]').forEach(e=>{e.scrollLeft=e.scrollWidth;});
  if(b)b();
  $$('[data-go]').forEach(x=>x.onclick=()=>{S.tab=x.dataset.go;go();window.scrollTo(0,0);});
}
go();
}
})();
</script>
