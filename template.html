<style>
:root{--blue-soft:#9db4e0}
*{box-sizing:border-box}
html{scroll-padding-top:150px}
body{margin:0;font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:22px 24px 60px}
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px 24px}.top .stamp{justify-self:end}.top-l .logo{max-height:92px;max-width:330px;display:block}@media(max-width:900px){.top{grid-template-columns:1fr}.top-l{justify-self:center}.top .brand{justify-self:center}.top .stamp{justify-self:center;text-align:center}}

h1{line-height:1.12;margin:6px 0 0;color:var(--ink)}
.stamp{color:var(--muted);text-align:right}
.stamp b{color:var(--ink)}
.tabs{display:flex;margin:26px 0 0}
.tabs button{background:none;border-bottom:2px solid transparent;font:inherit;font-weight:600;cursor:pointer}

:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

.filters{position:sticky;top:0;z-index:20;backdrop-filter:blur(6px);display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end}
.fgroup{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.fld select,.fld input[type=date],.ms-b{font:inherit;font-size:14px;color:var(--text);background:#fff;border:1px solid #cfdaee;border-radius:9px;padding:7px 10px;min-width:104px;height:36px}
.fld input[type=date]{min-width:140px}
.ms{position:relative}
.ms-b{width:200px;text-align:left;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ms-p{position:absolute;z-index:30;top:40px;left:0;width:320px;max-width:86vw;background:#fff;border:1px solid #cfdaee;border-radius:12px;box-shadow:0 12px 32px rgba(15,31,61,.16);padding:10px}
.ms-p[hidden]{display:none}
.ms-s{width:100%;font:inherit;font-size:14px;border:1px solid #cfdaee;border-radius:8px;padding:7px 10px}
.ms-a{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 4px;font-size:12px;color:var(--muted)}
.lnk{background:none;border:0;color:var(--blue);font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;padding:0}
.ms-l{max-height:260px;overflow:auto}
.ms-i{display:flex;gap:8px;align-items:flex-start;padding:5px 4px;border-radius:6px;font-size:13.5px;cursor:pointer}
.ms-i:hover{background:#f1f5fd}
.ms-i input{margin-top:3px}
.ms-more{padding:8px 4px;font-size:12.5px;color:var(--muted)}
.btn{font:inherit;font-size:13.5px;font-weight:600;color:var(--blue);background:#fff;border:1px solid #cfdaee;border-radius:9px;padding:0 14px;height:36px;cursor:pointer}

.fhint{flex-basis:100%;font-size:12.5px;color:var(--muted)}

.notice{background:var(--info-bg);border:1px solid var(--info-line);border-radius:12px;padding:12px 16px;margin:14px 0 0;font-size:14px}
.notice b{color:var(--blue)}
.notice.warn{border-color:#f0d5a8}
.notice.warn b{color:var(--amber)}
.notice.danger{border-color:#f2b8b8}
.notice.danger b{color:var(--red)}
.ni-heat{border-collapse:separate;border-spacing:0;font-size:13px;width:auto}
.ni-heat th,.ni-heat td{padding:7px 12px;text-align:center;white-space:nowrap}
.ni-heat th:first-child,.ni-heat td:first-child{text-align:center;position:sticky;left:0;background:#fff;box-shadow:1px 0 0 var(--line);z-index:1}
.ni-heat th:nth-child(2),.ni-heat td:nth-child(2){position:sticky;background:#fff;box-shadow:1px 0 0 var(--line);font-weight:700;z-index:1}
.ni-heat thead th{background:#fafcff;color:var(--muted);font-weight:600;position:sticky;top:0;z-index:2}
.ni-heat thead th:first-child,.ni-heat thead th:nth-child(2){z-index:3}
.ni-heat tbody.ni-heat-totais tr:first-child td{border-top:2px solid var(--line);font-weight:700}
.ni-heat tbody.ni-heat-totais tr:first-child td:first-child,.ni-heat tbody.ni-heat-totais tr:first-child td:nth-child(2){background:#fff}
.ni-heat tbody.ni-heat-totais tr:last-child td{color:var(--muted);font-size:12px}
.ni-heat tbody.ni-heat-totais tr:last-child td:first-child,.ni-heat tbody.ni-heat-totais tr:last-child td:nth-child(2){background:#fff}
.ni-heat td.cel{border-radius:5px}
.notice button.lnk{font-size:14px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:18px 0 0}
.saude-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.saude-grid table{font-size:12px}
.saude-grid th,.saude-grid td{padding:7px 4px}
@media (max-width:820px){.saude-grid{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}

.kpi .v{line-height:1.15;margin:6px 0 4px;font-variant-numeric:tabular-nums;white-space:nowrap}

.at-kpis{align-items:stretch}
.at-kpis .card.kpi{text-align:center;display:flex;flex-direction:column}
.at-kpis .kpi .l{font-size:17px}
/* número ocupa todo o espaço livre entre o título e a legenda, centralizado ali - assim fica
   grande "no meio" do quadrado e as legendas descem pra base, alinhadas entre os cards */
.at-kpis .kpi .v{flex:1;display:flex;align-items:center;justify-content:center;line-height:1;margin:8px 0;white-space:normal}
.at-kpis .kpi .s{padding-bottom:2px}
.at-status-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;margin:10px 0 2px}
.at-status-grid .n{font-size:30px;font-weight:800;color:var(--blue);line-height:1.15;font-variant-numeric:tabular-nums}
.at-status-grid .t{font-size:12.5px;color:#334155;margin-top:2px}
h2{color:var(--ink);margin:30px 0 4px}
h2 small{font-size:13px;font-weight:400;color:var(--muted);margin-left:8px}
h3{font-size:15px;color:var(--ink);margin:0 0 2px}
.sub{font-size:13px;color:var(--muted);margin:0 0 10px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;margin-top:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;margin-top:12px}
.ch{width:100%;height:auto;display:block}
.gr{stroke-width:1}
.ax{font-size:12px}
.vl{fill:#0f1f3d}
.ax2{font-size:10.5px;opacity:.8}
.vlb{font-size:12.5px}
.axb{font-size:13px;font-weight:600;fill:#334155}
.ax2.axb{font-size:9.5px;font-weight:500;fill:#64748b}
.dlt{font-size:13px;font-weight:800}
.dlt.up{fill:#1f9d6b}.dlt.dn{fill:#d64545}.dlt.eq{fill:#64748b}
.perbar{margin:16px 0 0;border:1px solid var(--info-line)}

body.locked>*:not(.gate){display:none}
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:999;padding:20px}
.gate-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px 26px;max-width:360px;width:100%;box-shadow:0 8px 30px rgba(15,31,61,.08);display:flex;flex-direction:column;gap:12px}
.gate-box h1{margin:0;font:700 24px 'Source Sans 3',system-ui,sans-serif;color:var(--ink)}.gate-box .logo{max-height:60px;max-width:280px;align-self:flex-start;margin-bottom:4px}.gate-lab{color:var(--accent);font-weight:700;font-size:13px}
.gate-box p{margin:0;color:var(--muted)}
.gate-box input[type=password]{font:inherit;font-size:16px;border:1px solid #cfdaee;border-radius:9px;padding:10px 12px;height:44px}
.gate-box button{font:inherit;font-weight:700;color:#fff;background:var(--blue);border:0;border-radius:9px;height:44px;cursor:pointer}
.gate-box button:disabled{opacity:.6;cursor:default}
.gate-ck{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.gate-err{color:#c53030;font-size:13.5px;min-height:18px}
.apbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin:20px 0 8px}
.apck{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--text);height:40px}
.aptb{border-collapse:separate;border-spacing:0}
.aptb th{padding:12px 14px;background:#f6f9ff;text-align:left;font-size:12.5px;color:#475569;border-bottom:1px solid #dfe8f6}
.aptb td{border-bottom:1px solid #edf2f9;vertical-align:middle;white-space:normal;text-align:left}
.aptb tbody tr:last-child td{border-bottom:0}
.aptb td.cd,.aptb th.cd{width:64px;color:#64748b;font-size:13px}
.aptb td.nm{min-width:230px;font-weight:600;color:var(--ink);font-size:14.5px}
.aptb td.nm .mt{display:block;margin-top:3px;font-weight:400;font-size:12px;color:var(--muted)}
.aptb td.pc,.aptb th.pc{min-width:140px;width:150px}
.aptb td.st,.aptb th.st{min-width:190px}
.aptb .pv{display:block;font-weight:700;color:var(--ink);white-space:nowrap}
.aptb .cdg{display:block;margin-top:1px;font-size:11.5px;color:#94a3b8;text-decoration:none}
.aptb .pz{display:block;margin-top:1px;font-size:11px;color:#94a3b8}
a.cdg:hover{text-decoration:underline;color:#2563eb}
.aptb td small{display:block;color:var(--muted);font-size:12px;line-height:1.35;margin-top:3px;font-weight:400}
.aptb td small.aviso{color:#8a5a00}

.aptb td.best .pv{color:#0f6b44}
.aptb .ck{color:#1f9d6b}
.aptb .mut{color:#94a3b8;font-size:13px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:#eef2f7;color:#334155}
.pill.ok{background:#d4f0e1;color:#0f6b44}.pill.warn{background:#fff1d6;color:#8a5a00}.pill.mut{background:#f1f5f9;color:#64748b}
.btn:disabled{opacity:.45;cursor:default}
@media(max-width:700px){
 .aptb thead{display:none}
 .aptb,.aptb tbody,.aptb tr,.aptb td{display:block;width:100%}
 .aptb tr{padding:12px 4px;border-bottom:1px solid #e3eaf6}
 .aptb td{padding:4px 12px;border:0!important;min-width:0!important;width:auto!important}
 .aptb td::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
 .aptb td.nm{font-size:15px}.aptb td.nm::before{display:none}
 .aptb td.cd{font-size:12.5px}
}
.tsm table{font-size:13px}.tsm th,.tsm td{padding-left:8px;padding-right:8px}
.wdl{margin:8px 0 0;font-size:13.5px;color:var(--ink);font-weight:600}
.hsw{display:flex;align-items:flex-start}
.axs{flex:none;display:block}
.hs{flex:1;min-width:0;overflow-x:auto;scrollbar-width:thin}

.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:0 0 6px}

.empty{padding:34px 10px;text-align:center;color:var(--muted);font-size:14px}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600;background:#fafcff;position:sticky;top:0}
tr.tot td{font-weight:700;border-top:2px solid var(--line)}
td.nm,th.nm{white-space:normal;min-width:220px;text-align:left}
.bar{background:linear-gradient(#a9c3ec,#a9c3ec) left bottom/var(--w) 4px no-repeat}
.dl{font-weight:700;font-size:12.5px}
.dl.up{color:var(--green)} .dl.dn{color:#d97706} .dl.eq,.dl.na{color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:#eef1f7;color:var(--muted);margin-left:6px}
.tag.w{background:#fff3e2;color:var(--amber)}
.seg{display:inline-flex;border:1px solid #cfdaee;border-radius:10px;overflow:hidden;background:#fff}
.seg button{font:inherit;font-size:13.5px;font-weight:600;border:0;background:none;padding:7px 16px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{color:#fff}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:26px 0 8px}
.pick{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.pick .card{flex:1 1 320px}
.pick .rng{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.cmpk{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:14px}
.cmpk .v{font-size:26px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}
.cmpk .p{font-size:13px;color:var(--muted)}
.notes li{margin:6px 0}
.notes{font-size:14px;max-width:88ch}
@media(max-width:900px){.filters{position:static}}
@media(max-width:700px){.wrap{padding:16px 14px 50px}.grid2{grid-template-columns:1fr}.ms-b{width:100%}.stamp{text-align:left}}



.kpi .v{font-size:clamp(30px,3.4vw,42px)}

.kpis-5{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpis-5 .v{font-size:clamp(17px,1.7vw,24px);white-space:nowrap}
/* tabela de "Consultar títulos": largura fixa por coluna (via colgroup no HTML) em vez de
   deixar o layout automático do navegador esticar uma coluna e apertar outra - largura
   auto sem colgroup deixava uma barra em branco sobrando no card quando a tabela toda
   ficava mais estreita que o card */
.cp-tab table{table-layout:fixed;width:100%}
.cp-tab table td,.cp-tab table th{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* todas as colunas centralizadas, incluindo Valor */
.cp-tab table td,.cp-tab table th{text-align:center}
.cp-tab table tfoot td{border-top:2px solid var(--line);font-weight:700;background:#fafcff}

.tabs button[aria-selected=true]{border-bottom-color:var(--blue)}
.subtabs{display:flex;flex-wrap:wrap;margin:10px 0 0}
.subtabs button{font:inherit;font-weight:600;cursor:pointer}

.fgroup#fgAtalhos{gap:10px}
.btn.atalho{font-size:15px;font-weight:700;height:48px;padding:0 20px;border-radius:12px;border-width:2px}
select.simple-sel{font-size:16px;height:48px;min-width:220px;border-radius:12px;border:2px solid #cfdaee;padding:8px 12px}
.kpis-simples{grid-template-columns:repeat(3,1fr)}
@media(max-width:820px){.kpis-simples{grid-template-columns:1fr}}


.cards-hoje{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:18px 0 0}
@media(max-width:820px){.cards-hoje{grid-template-columns:1fr}}
.card-hoje{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
.card-hoje h4{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.card-hoje .linha{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line)}
.card-hoje .linha:last-child{border-bottom:0}
.card-hoje .linha .lb{font-size:13px;color:var(--muted)}
.card-hoje .linha .vv{font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.meta-input{width:100%;font:inherit;font-size:14px;border:1px solid #cfdaee;border-radius:9px;padding:6px 10px;margin-top:8px}
.meta-bar{height:10px;border-radius:6px;background:#e3eaf5;margin-top:8px;overflow:hidden}
.meta-bar b{display:block;height:100%;background:var(--green);border-radius:6px}
.insight-card{background:#eef9f2;border:1px solid #bfe6cc;border-radius:14px;padding:16px 20px;margin:14px 0}
.insight-card.alerta{background:#fff3e2;border-color:#f0d5a8}
.insight-card h4{margin:0 0 6px;font-size:14px;color:#0f6b44}
.insight-card.alerta h4{color:var(--amber)}
.insight-card p{margin:0;font-size:14.5px;line-height:1.5;color:var(--text)}
.efeitos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
@media(max-width:820px){.efeitos{grid-template-columns:1fr}}
.efeito .v{font-size:24px;font-weight:800}
.efeito.pos .v{color:#0f6b44}
.efeito.neg .v{color:#b3261e}


:root{--r3-bg:#F8FAFC;--r3-surface:#FFFFFF;--r3-ok-bg:#DCFCE7;--r3-ok-tx:#16A34A;--r3-warn-bg:#FEF3C7;--r3-warn-tx:#D97706;--r3-err-bg:#FEE2E2;--r3-err-tx:#DC2626;--r3-info-bg:#DBEAFE;--r3-info-tx:#2563EB}

.card,.card-hoje,.kpi{font-variant-numeric:tabular-nums}

.btn:focus-visible,select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--r3-brand);outline-offset:2px}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:6px}

.live-dot::before{content:'';width:7px;height:7px;border-radius:99px;background:var(--r3-ok-tx)}

/* ===== sistema visual v2: uma paleta, uma fonte, cor só quando significa algo =====

:root{--card:#ffffff;--ink:#1b2430;--text:#2b3440;--good:#2f7d4f;--bad:#b42318;--warn:#b45309;--blue:var(--accent);--green:var(--good);--red:var(--bad);--amber:var(--warn);--r3-brand:var(--accent);--r3-border:var(--line);--r3-ink:var(--ink);--r3-muted:var(--muted);--info-bg:transparent;--info-line:var(--line)}

/* filtros: mesma altura e mesmo peso em tudo */
.btn,.btn.atalho{height:36px;font-size:14px;font-weight:600;border-width:1px;border-radius:8px;padding:0 14px;color:var(--ink);border-color:#d6d6cf}

/* cartões retos, sem sombra de "hover" em coisa que não é clicável */
.card,.card-hoje{transition:none}

.card-tit{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--ink)}
.kpi .l{font-weight:600}
.kpi .v{font-weight:700;color:var(--ink)}
.kpi .s{color:var(--muted)}
.kpi .s b{color:var(--ink);font-weight:600}
.kpi-extra{margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
/* aviso de período: uma linha discreta em vez de caixa azul */
.perbar,.notice{background:none;border:0;border-left:3px solid var(--accent);border-radius:0;padding:3px 12px;font-size:13.5px;color:var(--muted)}

/* tabelas */
th,.aptb th{background:none;font-weight:600;border-bottom:1px solid #cfcfc7}
table tr:hover td{background:#fafaf7}
tr.tot td{background:none}

.pbar b,.rc-bar b{background:var(--accent)}
.rc-nome{font-weight:500;color:var(--ink)}
.rc-val{color:var(--muted)}
.pill,.badge,.tag{border-radius:4px}
.live-dot::before{animation:none}
.saude-top table{font-size:13.5px}.saude-top th,.saude-top td{padding:7px 6px}.saude-top td.nm{min-width:0}
.saude-top table{table-layout:fixed}.saude-top th.nm{width:34%}.saude-top td.nm{font-size:13.5px}
.saude-top .st-var{display:inline;margin-left:5px}.saude-top .st-var .dl{font-size:11.5px}
.saude-top td{white-space:normal;vertical-align:middle}

.saude-top .st-era{display:inline;font-size:11.5px;color:var(--muted)}.saude-top td{white-space:nowrap;padding-left:10px}.saude-top td.nm{white-space:normal;width:1%;min-width:120px;padding-left:0}.saude-top th:nth-child(3),.saude-top td:nth-child(3),.saude-top th:nth-child(4),.saude-top td:nth-child(4){text-align:center}.saude-top .st-era .dl{font-size:12.5px;white-space:nowrap}
/* gráficos */

/* ===== v3 "acolhedor": pensado pro dono de laboratório pequeno/médio (mais velho, técnico,
   pouca intimidade com número e tela). Clareza pelo desenho, não por texto explicativo:
   cada assunto tem a SUA cor (faturamento sempre azul, atendimentos sempre roxo...),
   verde/vermelho só nas setas de melhora/piora, letra maior, aba ativa bem marcada. */
:root{--bg:#f1f5fb;--line:#e0e7f1;--accent:#1f63c6;--accent-soft:#e3edfb;--muted:#5f6b7a;--c-fat:#1f63c6;--c-atd:#7a3fd1;--c-exa:#0e7490;--c-prj:#b45309}
body{font-size:16px}

.brand{text-align:center;justify-self:center}.brand h1{font-size:38px;margin:0}.brand .eyebrow{font-size:16px;color:var(--accent);font-weight:700;margin-top:2px}
.btn .ti,.tabs .ti{width:17px;height:17px;margin-right:7px;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{color:var(--accent);text-transform:none;letter-spacing:.01em;font-size:13px;font-weight:700}
h1{font-size:26px}
.tabs{gap:4px;border-bottom:2px solid var(--accent)}
.tabs button{font-size:16px;padding:11px 11px;color:#475569;border-radius:10px 10px 0 0;border:0;margin-bottom:0}.tabs{justify-content:space-between}
.tabs button:hover{background:#e3edfb;color:var(--ink)}
.tabs button[aria-selected=true]{background:var(--accent);color:#fff;border-radius:10px 10px 0 0;border:0}
.subtabs button{font-size:15px;padding:7px 14px;border:1px solid #cfdcef;border-radius:20px;background:#fff;color:#475569}
.subtabs button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.card,.card-hoje{border-radius:12px;border-color:var(--line);box-shadow:0 1px 3px rgba(15,31,61,.05)}
.card:hover,.card-hoje:hover{box-shadow:0 1px 3px rgba(15,31,61,.05)}
.kpi .l{font-size:15px;color:#334155}
.kpi .s{font-size:14px}
.perbar{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:8px;padding:8px 14px;font-size:14px;color:#334155}
/* cor por assunto: faixa no topo do card + número na mesma cor */
.kpi.t-fat,.kpi.t-atd,.kpi.t-exa,.kpi.t-prj{border-top-width:4px}
.kpi.t-fat{border-top-color:var(--c-fat)}.kpi.t-fat .v{color:var(--c-fat)}
.kpi.t-atd{border-top-color:var(--c-atd)}.kpi.t-atd .v{color:var(--c-atd)}
.kpi.t-exa{border-top-color:var(--c-exa)}.kpi.t-exa .v{color:var(--c-exa)}
.kpi.t-prj{border-top-color:var(--c-prj)}.kpi.t-prj .v{color:var(--c-prj)}
/* card de projeção no formato de linhas (acumulado / projeção) */
.kpi-proj .proj-linha{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.kpi-proj .l+.proj-linha{margin-top:12px;padding-top:0;border-top:0}
.kpi-proj .proj-lb{font-size:14px;color:var(--muted)}
.kpi-proj .proj-vv{font-size:19px;color:var(--ink)}
.kpi-proj .proj-vv.proj-dest{font-size:24px;color:var(--c-prj)}
.kpi-proj .s{margin-top:10px}
.pbar,.rc-bar{background:#e8eef7}
.rc-nome{font-size:14px}
/* botão de ajuda "?" e balão */
.ajuda{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid #b8c6dc;background:#fff;color:#4b5b73;font:700 11.5px/1 inherit;cursor:pointer;padding:0;margin-left:4px;vertical-align:2px}
.ajuda:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.ajuda-bal{position:absolute;z-index:999;background:#1b2430;color:#fff;font-size:13.5px;line-height:1.45;padding:10px 12px;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);text-align:left;font-weight:400}
.cfg-lnk{margin-top:4px;font-size:12.5px}
.btn-print{margin-left:auto}
/* impressão: só o conteúdo, sem abas, filtros e botões */
@media print{
  body{background:#fff!important;font-size:12px}
  .tabs,.subtabs,.filters,.btn,.ajuda,.ajuda-bal,.cfg-lnk,.perbar{display:none!important}

}

  .tw{max-width:100%}
  #fToggle{display:inline-flex;align-items:center}

  .aptb.keep{display:table}.aptb.keep thead{display:table-header-group}.aptb.keep tbody{display:table-row-group}
  .aptb.keep tr{display:table-row;padding:0}.aptb.keep>tbody>tr>td,.aptb.keep>thead>tr>th{display:table-cell;width:auto!important;padding:10px 8px!important}

  .aptb.keep td,.aptb.keep th{min-width:0!important}
  /* Saúde do Negócio: a tabela rola de lado em vez de espremer as colunas */
  .saude-top{overflow-x:auto}.saude-top table{table-layout:auto;min-width:470px}.saude-top th{white-space:nowrap}

}

<script>
(function(){

/* ---------- painel protegido por senha (dados criptografados: AES-256-GCM + PBKDF2) ---------- */
function abrirComSenha(RAW){

function start(D){

const maskPeriodo=()=>periodo().mask;

function agg(dm,dd,keyFn){

/* ---------- gráficos (SVG puro, sem bibliotecas) ---------- */
function niceCeil(v){if(!(v>0))return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}

function maxOf(series){let m=0;series.forEach(s=>s.values.forEach(v=>{if(v!=null&&v>m)m=v;}));return m;}
function chartLine(o){
  const n=o.labels.length,mx=maxOf(o.series);
  if(!n||!(mx>0))return '<div class="empty">Sem dados para o filtro selecionado.</div>';
  const f=frame(o,n,mx),X=i=>f.ml+(n>1?i*f.iw/(n-1):f.iw/2),Y=v=>f.mt+f.ih-(v/f.top)*f.ih;
  let s=`<svg class="ch" viewBox="0 0 ${f.W} ${f.H}" role="img" aria-label="${esc(o.aria||'gráfico de linhas')}">${f.g}`;

    // linha reta ponto a ponto (a curva suavizada passava por baixo/por cima dos pontos reais)

    if(n<=40)se.values.forEach((v,i)=>{if(v==null)return;const pc=parc&&i===n-1,cor=pc?'#9aa0a6':se.color;s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="${o.keyVals?3:3.6}" fill="${o.keyVals&&!pc?cor:'#fff'}" stroke="${cor}" stroke-width="2"><title>${esc(o.labels[i])} · ${esc(se.name)}: ${esc((o.tip||o.axis||fNum.format)(v))}</title></circle>`;});

      if(idx.length){const imax=idx.reduce((a,b)=>b[0]>a[0]?b:a)[1],imin=idx.reduce((a,b)=>b[0]<a[0]?b:a)[1],iult=idx[idx.length-1][1];

        if(parc){const v=se.values[n-1];s+=`<text class="vl" x="${X(n-1)-10}" y="${Y(v)+4}" text-anchor="end" style="fill:#80868b;font-weight:600">${esc(fv(v))}*</text>`;}}
    }

function chartBars(o){

function chartBarsX(o){

function multi(host,cfg){
  host.innerHTML='<div class="ms"><button type="button" class="ms-b"></button><div class="ms-p" hidden><input type="search" class="ms-s" placeholder="Buscar…" aria-label="Buscar"><div class="ms-a"><button type="button" class="lnk">Limpar seleção</button><span></span></div><div class="ms-l"></div></div></div>';
  const btn=$('.ms-b',host),pn=$('.ms-p',host),q=$('.ms-s',host),ls=$('.ms-l',host),cnt=$('.ms-a span',host);
  const ehNum=cfg.items.length>0&&typeof cfg.items[0].i==='number'; // ids podem ser índice numérico (ex: médico) ou texto (ex: código de exame)
  const conv=v=>ehNum?+v:v;
  const byI=new Map(cfg.items.map(x=>[x.i,x]));
  cfg.items.forEach(x=>x.k=norm(x.label));
  const lab=()=>!cfg.set.size?cfg.all:cfg.set.size===1?byI.get([...cfg.set][0]).label:cfg.set.size+' selecionados';
  function list(){
    const t=norm(q.value);let h='',n=0,tot=0;
    for(const x of cfg.items){if(t&&!x.k.includes(t))continue;tot++;if(n>=200)continue;n++;
      h+=`<label class="ms-i"><input type="checkbox" data-i="${esc(String(x.i))}" ${cfg.set.has(x.i)?'checked':''}><span>${esc(x.label)}</span></label>`;}
    if(tot>n)h+=`<div class="ms-more">Mostrando ${n} de ${tot}. Refine a busca para ver os demais.</div>`;
    ls.innerHTML=h||'<div class="ms-more">Nada encontrado.</div>';cnt.textContent=tot+' opções';
  }
  btn.onclick=()=>{$$('.ms-p').forEach(p=>{if(p!==pn)p.hidden=true;});pn.hidden=!pn.hidden;if(!pn.hidden){list();q.focus();}};
  q.oninput=list;
  $('.lnk',pn).onclick=()=>{cfg.set.clear();btn.textContent=lab();list();cfg.onChange();};
  ls.onchange=e=>{const i=conv(e.target.dataset.i);e.target.checked?cfg.set.add(i):cfg.set.delete(i);btn.textContent=lab();cfg.onChange();};
  document.addEventListener('click',e=>{if(!host.contains(e.target))pn.hidden=true;});
  btn.textContent=lab();
  return {refresh(){btn.textContent=lab();if(!pn.hidden)list();}};
}

function previsaoFechamentoMes(dd){
  // olha os últimos 3 anos (mesmo mês) e vê que fração do faturamento do mês inteiro já
  // costumava estar dentro até o mesmo dia em que estamos hoje; usa a média disso pra
  // projetar o total do mês a partir do que já entrou até agora.
  const fracoes=[];
  for(let k=1;k<=3;k++){
    const anoRef=uy-k;
    const totalMes=agg(dayMask(i=>diaAno[i]===anoRef&&diaMes[i]===um),dd,null).tot.f;
    if(!totalMes)continue;
    const diasMesRef=new Date(anoRef,um,0).getDate(),diaEq=Math.min(ULTDOM,diasMesRef);
    const parcial=agg(dayMask(i=>diaAno[i]===anoRef&&diaMes[i]===um&&diaDom[i]<=diaEq),dd,null).tot.f;
    fracoes.push(parcial/totalMes);
  }
  if(!fracoes.length)return null;
  return {fracaoMedia:fracoes.reduce((a,b)=>a+b,0)/fracoes.length,anos:fracoes.length};
}

  const mets=[
    {t:'Faturamento líquido',fmt:v=>fBRL.format(v),tf:v=>fBRL0.format(v),ax:v=>'R$ '+fCmp.format(v),lb:v=>fCmp.format(v),g:o=>o.f,cor:['#a9c3ec','#1f63c6'],tc:'t-fat'},

    {t:'Ticket médio',fmt:v=>fBRL.format(v),ax:v=>'R$ '+fD1.format(v),lb:v=>fBRL0.format(v),g:o=>tk(o),cor:['#f0c79a','#b45309'],tc:'t-prj'}];
  let h=`<div class="pick"><div class="card"><h3>Comparativo anual</h3><div class="row" style="margin:6px 0 8px"><div class="seg" role="group" aria-label="Modo"><button data-am="m24" aria-pressed="${m24}">Últimos 24 meses</button><button data-am="ano" aria-pressed="${!m24}">Comparar dois anos</button></div></div><p class="sub">${intro}</p>${ctrl}</div></div>${aviso}`;
  if(!comuns.length&&!aviso)h+=`<div class="notice warn"><b>Não há meses em comum entre ${cA.name} e ${cB.name}.</b> A base vai de ${isoBR(PRI)} a ${isoBR(ULT)}. Escolha outros anos.</div>`;
  if(comuns.length){
    const sa=Z(),sb=Z();comuns.forEach(g=>['f','b','x','e','r'].forEach(k=>{sa[k]+=g.a[k];sb[k]+=g.b[k];}));
    // mesmo formato de card das outras telas: número na cor do assunto, variação embaixo, período anterior separado

    h+=`<div class="kpis-dia">${kp('Faturamento líquido',fBRL0.format,sa.f,sb.f,'t-fat')}${kp('Pacientes atendidos',fNum.format,sa.r,sb.r,'t-atd')}${kp('Exames realizados',fNum.format,sa.e,sb.e,'t-exa')}${kp('Ticket médio',fBRL.format,tk(sa),tk(sb),'t-prj')}</div>`;

  h+=`<div class="subtabs" style="margin:14px 0 0">${mets.map((m,i)=>`<button role="tab" data-anmet="${i}" aria-selected="${(S.anMet||0)===i}">${m.t.replace(' líquido','').replace(' atendidos','').replace(' realizados','')}</button>`).join('')}</div>`;
  [mets[S.anMet||0]].forEach(m=>{
    const vA=groups.map(g=>ok(g.a)?m.g(g.a):null),vB=groups.map(g=>ok(g.b)?m.g(g.b):null);
    const dl=groups.map((g,i)=>vA[i]!=null&&vB[i]!=null&&vA[i]>0?dlt(vA[i],vB[i]):null);
    const cA2={name:cA.name,color:m.cor[0]},cB2={name:cB.name,color:m.cor[1]};
    h+=`<div class="card" style="margin-top:14px"><h3>${m.t}</h3>${legend([cA2,cB2])}${chartBarsX({big:true,scroll:W<700,rot:false,oneVal:true,w:W,h:400,end:true,labels:groups.map(g=>g.sub?[g.label,g.sub]:g.label),series:[{...cA2,values:vA},{...cB2,values:vB}],axis:m.ax,tip:m.fmt,fmtVal:m.lb,deltas:dl,aria:m.t+', '+cA.name+' contra '+cB.name})}</div>`;});
  h+=anualExtras(groups,cA,cB);
  h+=`<details class="ap-atencao"><summary><h2 style="display:inline">Tabela mês a mês</h2> <span class="sub">os mesmos números dos gráficos, em tabela · clique para abrir</span></summary><div class="card tw tsm"><table><thead><tr><th rowspan="2">Mês</th>${mets.map(m=>`<th colspan="3" style="text-align:center">${m.t}</th>`).join('')}</tr><tr>${mets.map(()=>`<th>${m24?'Anteriores':cA.name}</th><th>${m24?'Recentes':cB.name}</th><th>Var.</th>`).join('')}</tr></thead><tbody>`;
  groups.forEach(g=>{h+=`<tr><td>${g.full}</td>`;mets.forEach(x=>{const a=ok(g.a)?x.g(g.a):null,b=ok(g.b)?x.g(g.b):null;
    const tf=x.tf||x.fmt;h+=`<td>${a==null?'—':tf(a)}</td><td>${b==null?'—':tf(b)}</td><td>${a!=null&&b!=null?delta(a,b):'—'}</td>`;});h+='</tr>';});
  if(comuns.length){const sa=Z(),sb=Z();comuns.forEach(g=>['f','b','x','e','r'].forEach(k=>{sa[k]+=g.a[k];sb[k]+=g.b[k];}));
    h+=`<tr class="tot"><td>Total dos meses comparados</td>${mets.map(x=>`<td>${(x.tf||x.fmt)(x.g(sa))}</td><td>${(x.tf||x.fmt)(x.g(sb))}</td><td>${delta(x.g(sa),x.g(sb))}</td>`).join('')}</tr>`;}
  h+='</tbody></table></div></details>';
  if(fnote)h+=`<p class="sub" style="margin-top:10px">${fnote}</p>`;
  const dmFiltro=PER.def?maskRange(r12.ini,r12.fim):PER.mask,periodoLbl=PER.def?'últimos 12 meses':'período escolhido';
  const mon12=agg(dmFiltro,dd,i=>diaYM[A.d[i]]).g,ym12=[...mon12.keys()].sort((a,b)=>a-b);
  const tot12=agg(dmFiltro,dd,null).tot;
  h+=`<h2>Relatório mensal<small>${periodoLbl}</small></h2><div class="card tw"><table><thead><tr><th>Mês</th><th>Faturamento líquido</th><th>Variação</th><th>Bruto</th><th>Descontos</th><th>Exames</th><th>Pacientes</th><th>Ticket médio</th></tr></thead><tbody>`;
  const pm0=ym12.length?agg(dayMask(i=>diaYM[i]===ym12[0]-1),dd,null).tot:null;
  ym12.forEach((k,i)=>{const o=mon12.get(k),p=i?mon12.get(ym12[i-1]):(pm0&&pm0.r>0?pm0:null);
    h+=`<tr><td>${MESL[k%12]} de ${Math.floor(k/12)}${PARCIAL&&k===ULTYM?` <span class="tag w">até ${isoBR(ULT).slice(0,5)}</span>`:''}</td><td>${fBRL.format(o.f)}</td><td>${PARCIAL&&k===ULTYM?'<span class="dl na">parcial</span>':p?delta(p.f,o.f):'<span class="dl na">—</span>'}</td><td>${fBRL.format(o.b)}</td><td>${fBRL.format(o.x)}</td><td>${fNum.format(o.e)}</td><td>${fNum.format(o.r)}</td><td>${fBRL.format(tk(o))}</td></tr>`;});
  h+=`<tr class="tot"><td>Total</td><td>${fBRL.format(tot12.f)}</td><td></td><td>${fBRL.format(tot12.b)}</td><td>${fBRL.format(tot12.x)}</td><td>${fNum.format(tot12.e)}</td><td>${fNum.format(tot12.r)}</td><td>${fBRL.format(tk(tot12))}</td></tr></tbody></table></div>`;
  const uni12=agg(dmFiltro,dd,i=>A.u[i]).g;
  const ul12=[...uni12.entries()].sort((a,b)=>b[1].f-a[1].f),mxu12=ul12.length?ul12[0][1].f:1;
  h+=`<h2>Por unidade<small>${periodoLbl}</small></h2><div class="card tw"><table><thead><tr><th>Unidade</th><th>Faturamento líquido</th><th>% do total</th><th>Exames</th><th>Pacientes</th><th>Ticket médio</th></tr></thead><tbody>`;
  ul12.forEach(([k,o])=>{h+=`<tr><td>${esc(D.unidades[k].nome)}</td><td class="bar" style="--w:${(o.f/mxu12*100).toFixed(1)}%">${fBRL.format(o.f)}</td><td>${fD1.format(tot12.f?o.f/tot12.f*100:0)}%</td><td>${fNum.format(o.e)}</td><td>${fNum.format(o.r)}</td><td>${fBRL.format(tk(o))}</td></tr>`;});
  h+='</tbody></table></div>';
  return h;
}

/* Comparativo Anual: duas perguntas a mais, calculadas no fato B (mês x unidade x convênio x exame),
   nos mesmos dois períodos dos gráficos (meses em comum). */
function anualExtras(groups,cA,cB){
  const ok=o=>o&&o.r>0,mA=new Set(),mB=new Set();
  groups.forEach(g=>{if(ok(g.a)&&ok(g.b)){if(g.ymA!=null)mA.add(g.ymA);if(g.ymB!=null)mB.add(g.ymB);}});
  if(!mA.size||!mB.size)return '';
  const B=D.B,dd=dims(),{mu,mc}=dd,ex=new Map(),uc=new Map();
  for(let i=0;i<B.mo.length;i++){
    const ym=mesYM[B.mo[i]],a=mA.has(ym),b=mB.has(ym);if(!a&&!b)continue;
    if(mu&&!mu[B.u[i]])continue;if(mc&&!mc[B.c[i]])continue;
    const x=B.x[i];let e=ex.get(x);if(!e){e={fa:0,fb:0,ea:0,eb:0};ex.set(x,e);}
    if(b){e.fb+=B.l[i];e.eb+=B.e[i];const u=B.u[i];let o=uc.get(u);if(!o){o={t:0,c:new Map()};uc.set(u,o);}o.t+=B.l[i];o.c.set(B.c[i],(o.c.get(B.c[i])||0)+B.l[i]);}
    else{e.fa+=B.l[i];e.ea+=B.e[i];}
  }
  const rows=[...ex.entries()].filter(([,e])=>e.fa>=15000||e.fb>=15000).map(([x,e])=>({nome:D.exames[x].nome,...e,d:e.fb-e.fa})).sort((a,b)=>b.d-a.d);
  const mil=v=>'R$ '+(Math.abs(v)>=1e6?fD2.format(v/1e6)+' mi':fCmp.format(v));
  const tr=r=>`<tr><td class="nm"><b>${esc(r.nome)}</b><span style="display:block;font-size:12px;color:var(--muted)">${fNum.format(r.eb)} exames · eram ${fNum.format(r.ea)}</span></td><td><b>${mil(r.fb)}</b><span style="display:block;font-size:12px;color:var(--muted)">era ${mil(r.fa)}</span></td><td>${r.fa>0?delta(r.fa,r.fb):'<span class="tag">novo</span>'}</td></tr>`;
  const tb=(ic,t,cls,L)=>`<div class="card tw"><h3 class="card-tit"><span class="dl ${cls}">${ic}</span> ${t}</h3>${L.length?`<table class="tb"><thead><tr><th class="nm">Exame</th><th>Faturou</th><th>Variação</th></tr></thead><tbody>${L.map(tr).join('')}</tbody></table>`:'<div class="empty">Nada para comparar.</div>'}</div>`;
  const cores=['#1f63c6','#7a3fd1','#0e7490'];
  const un=[...uc.entries()].filter(([,o])=>o.t>0).sort((a,b)=>b[1].t-a[1].t).map(([u,o])=>{const top=[...o.c.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3);
    return `<tr><td class="nm"><b>${esc(D.unidades[u].nome)}</b></td><td>${mil(o.t)}</td><td style="min-width:260px"><div style="display:flex;height:16px;border-radius:8px;overflow:hidden;background:#e6ecf5">${top.map(([c,v],i)=>`<b style="width:${(v/o.t*100).toFixed(1)}%;background:${cores[i]}" title="${esc(D.convenios[c].nome)}"></b>`).join('')}</div><div style="font-size:12.5px;color:var(--muted);margin-top:3px">${top.map(([c,v],i)=>`<span style="color:${cores[i]};font-weight:700">■</span> ${esc(D.convenios[c].nome)} ${fD1.format(v/o.t*100)}%`).join(' &nbsp; ')}</div></td></tr>`;}).join('');
  return `<h2>Exames que mais mudaram<small>${esc(cB.name)} contra ${esc(cA.name)} · em faturamento · só exames com mais de R$ 15 mil</small></h2>
   <div class="saude-grid">${tb('▲','Mais cresceram','up',rows.slice(0,5))}${tb('▼','Mais caíram','dn',rows.slice(-5).reverse().filter(r=>r.d<0))}</div>
   <h2>De onde vem o paciente de cada unidade<small>${esc(cB.name)} · os 3 maiores convênios de cada unidade</small></h2>
   <div class="card tw"><table class="tb"><thead><tr><th class="nm">Unidade</th><th>Faturou</th><th style="text-align:left">Quem paga a conta</th></tr></thead><tbody>${un}</tbody></table></div>`;
}
function bindAnual(){$$('[data-anmet]').forEach(b=>b.onclick=()=>{S.anMet=+b.dataset.anmet;go();});$$('[data-am]').forEach(b=>b.onclick=()=>{S.anMode=b.dataset.am;go();});const a=$('#sA'),b=$('#sB');if(a)a.onchange=e=>{S.anoA=+e.target.value;go();};if(b)b.onchange=e=>{S.anoB=+e.target.value;go();};}

/* ---------- comparar períodos ---------- */
function daysBetween(a,b){const f=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));return Math.round((f(b)-f(a))/864e5);}
function viewPeriodos(){

  const row=(t,x,y,fmt)=>`<tr><td>${t}</td><td>${fmt(x)}</td><td>${fmt(y)}</td><td>${fmt(y-x)}</td><td>${delta(x,y)}</td></tr>`;

   ${row('Faturamento líquido',fa.f,fb.f,fBRL.format)}${row('Faturamento bruto',fa.b,fb.b,fBRL.format)}${row('Descontos concedidos',fa.x,fb.x,fBRL.format)}
   ${row('Atendimentos (pacientes)',fa.r,fb.r,fNum.format)}${row('Exames realizados',fa.e,fb.e,fNum.format)}${row('Ticket médio',tk(fa),tk(fb),fBRL.format)}
   ${row('Exames por paciente',fa.r?fa.e/fa.r:0,fb.r?fb.e/fb.r:0,fD1.format)}
   ${row('Faturamento por dia corrido',fa.f/a.cal,fb.f/b.cal,fBRL.format)}${row('Atendimentos por dia corrido',fa.r/a.cal,fb.r/b.cal,fD1.format)}
   <tr><td>Dias com atendimento</td><td>${a.dias} de ${a.cal}</td><td>${b.dias} de ${b.cal}</td><td></td><td></td></tr></tbody></table></div>`;
  const Wv=Math.max(300,($('#view').clientWidth||1100)-44);
  const nmax=Math.max(a.cal,b.cal),idx=Array.from({length:nmax},(_,i)=>i);
  const addD=(iso,k)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+k);return pad(d.getDate())+'/'+pad(d.getMonth()+1);};
  const cA={name:'Período A ('+wdS(S.pa.ini)+' a '+wdS(S.pa.fim)+')',color:'#9db4e0'},cB={name:'Período B ('+wdS(S.pb.ini)+' a '+wdS(S.pb.fim)+')',color:'#2563eb'};
  const labD=idx.map(i=>['dia '+(i+1),i<a.cal?'A '+wdS(isoAdd(S.pa.ini,i)):'',i<b.cal?'B '+wdS(isoAdd(S.pb.ini,i)):'']);

  const mets=[{t:'Faturamento líquido',k:'f',cor:['#a9c3ec','#1f63c6'],ax:v=>'R$ '+fCmp.format(v),tip:v=>fBRL.format(v),fv:v=>fNum.format(Math.round(v)),fc:v=>fCmp.format(v)},

/* ---------- médicos (alertas): quem parou ou caiu de pedir exames ---------- */
function medAlertasCalc(){
  const dd=dims(),{mu,mc}=dd,age=new Int32Array(NDIAS);
  for(let i=0;i<NDIAS;i++)age[i]=daysBetween(D.dias[i],ULT);
  const nM=D.medicos.length,rec=new Float64Array(nM),ant=new Float64Array(nM),p90=new Float64Array(nM),f90=new Float64Array(nM),ult=new Int32Array(nM).fill(1e9);
  const sem=new Map(); // médico -> Set de semanas com paciente (13 semanas antes dos últimos 30 dias)
  const Ad=A.d,Am=A.m,Ar=A.r,Al=A.l,Au=A.u,Ac=A.c;
  for(let i=0;i<N;i++){
    if(mu&&!mu[Au[i]])continue; if(mc&&!mc[Ac[i]])continue;
    const m=Am[i],a=age[Ad[i]],r=Ar[i];
    if(r>0){if(a<ult[m])ult[m]=a;}
    if(a<30)rec[m]+=r;
    else if(a<60)ant[m]+=r;
    if(a>=30&&a<121){p90[m]+=r;f90[m]+=Al[i];if(r>0){let s=sem.get(m);if(!s){s=new Set();sem.set(m,s);}s.add(Math.floor((a-30)/7));}}
  }
  // primeira vez que o médico aparece em toda a história (idade máxima)
  const maisAntigo=new Int32Array(nM).fill(-1);
  for(let i=0;i<N;i++){if(mu&&!mu[Au[i]])continue;if(mc&&!mc[Ac[i]])continue;if(Ar[i]>0){const a=age[Ad[i]];if(a>maisAntigo[Am[i]])maisAntigo[Am[i]]=a;}}
  const valido=m=>{const md=D.medicos[m];if(!md)return false;const n=normTxt(md.nome);return !/solicitac|propri|sem medico|^cod\./.test(n);};
  const sumidos=[],caindo=[];
  sem.forEach((s,m)=>{if(!valido(m)||s.size<8)return;
    if(rec[m]===0)sumidos.push({m,sem:s.size,fat:f90[m],dias:ult[m]});
    else{const media=p90[m]/3;if(media>=8&&rec[m]<=media*0.5)caindo.push({m,media,agora:rec[m]});}});
  sumidos.sort((a,b)=>b.fat-a.fat);caindo.sort((a,b)=>(b.media-b.agora)-(a.media-a.agora));
  let ativos=0,ativosAnt=0,novos=0,novosAnt=0;
  for(let m=0;m<nM;m++){if(!valido(m))continue;if(rec[m]>0)ativos++;if(ant[m]>0)ativosAnt++;if(maisAntigo[m]>=0&&maisAntigo[m]<30)novos++;else if(maisAntigo[m]>=30&&maisAntigo[m]<60)novosAnt++;}
  const rank=[];for(let m=0;m<nM;m++)if(valido(m)&&rec[m]>0)rank.push({m,agora:rec[m],antes:ant[m]});
  rank.sort((a,b)=>b.agora-a.agora);
  return {sumidos,caindo,ativos,ativosAnt,novos,novosAnt,rank:rank.slice(0,15)};
}

   ${R.rank.map((x,i)=>`<tr><td>${i+1}</td><td class="nm">${nome(x.m)}</td><td><b>${fNum.format(x.agora)}</b></td><td>${fNum.format(x.antes)}</td><td>${delta(x.antes,x.agora)}</td></tr>`).join('')}</tbody></table></div>`;
  return h;
}

S.tat={mes:''};
function tatMesesFechados(){
  const ms=[...new Set(D.tempoEntrega.linhas.map(l=>l[0]))].sort(),atual=ULT.slice(0,7);
  return ms.filter(m=>m<atual); // mês corrente ainda tem exames sem liberar: fica de fora
}
function tatAgg(meses,key){
  const set=new Set(meses),g=new Map();
  for(const [ym,st,cod,q,np,hd,hp] of D.tempoEntrega.linhas){
    if(!set.has(ym))continue;const k=key([ym,st,cod]);let o=g.get(k);if(!o){o={q:0,np:0,hd:0,hp:0};g.set(k,o);}
    o.q+=q;o.np+=np;o.hd+=hd;o.hp+=hp;}
  return g;
}
function tatDias(h){ // média em horas -> texto: "0,8 dia antes", "2,3 dias depois", "no dia"
  const d=Math.abs(h)/24;if(d<0.25)return 'no prazo certinho';
  const t=fD1.format(d)+(d>=1.95?' dias':' dia');return h<0?t+' antes':t+' depois';
}

function ytdMask(y){return dayMask(i=>diaAno[i]===y&&(diaMes[i]<um||(diaMes[i]===um&&diaDom[i]<=ULTDOM)));}
function variacaoGrupo(keyFn,dim,quality,topN=20){
  // olha só os "principais" (maiores em faturamento OU em exames no ano anterior) e,
  // dentro desse grupo, ordena pela variação - assim o top não fica dominado por quem
  // tinha uma base pequena e deu um salto sem relevância real.
  const anos=[uy,uy-1,uy-2];
  const porAno=anos.map(y=>agg(ytdMask(y),{},keyFn).g);
  const ant=porAno[1];
  const porFat=[...ant.entries()].sort((a,b)=>b[1].f-a[1].f).slice(0,topN).map(([k])=>k);
  const porExa=[...ant.entries()].sort((a,b)=>b[1].e-a[1].e).slice(0,topN).map(([k])=>k);
  const principais=new Set([...porFat,...porExa]);
  const linhas=[];
  principais.forEach(k=>{
    const antV=ant.get(k);
    if(!antV||!(antV.f>0))return;
    const atualV=porAno[0].get(k)||Z(),ant2V=porAno[2].get(k)||null;
    linhas.push({k,nome:dim[k]?dim[k].nome:('Cód. '+k),q:quality?quality(k):0,atual:atualV,ant:antV,ant2:ant2V,pct:(atualV.f-antV.f)/antV.f*100});
  });
  linhas.sort((a,b)=>b.pct-a.pct);
  return {linhas,pool:principais.size};
}

function montaInsightSaude(t0,t1,rotuloPeriodo){

  const tk0=tk(t0),tk1=tk(t1);
  const efeitoVolume=(t0.r-t1.r)*tk1;   // variacao de volume, valorizada no ticket antigo
  const efeitoPreco=(tk0-tk1)*t0.r;     // variacao de ticket, valorizada no volume novo
  let alerta='',texto='';
  if(varR<0){
    const perdaVolume=(t1.r-t0.r)*tk0;
    alerta=' alerta';
    texto=`O faturamento variou <b>${fD1.format(varF)}%</b>, mas o volume de atendimentos caiu <b>${fD1.format(Math.abs(varR))}%</b>. Se o volume de ${rotuloPeriodo} de ${uy-1} tivesse se mantido, com o ticket médio de hoje (${fBRL.format(tk0)}), o faturamento seria <b>${fBRL0.format(perdaVolume)} maior</b>.`;
  }else{
    texto=`O faturamento variou <b>${fD1.format(varF)}%</b> com o volume de atendimentos variando <b>${fD1.format(varR)}%</b> — o crescimento veio ${Math.abs(efeitoPreco)>Math.abs(efeitoVolume)?'principalmente do <b>ticket médio</b> (preço)':'principalmente do <b>volume</b> de atendimentos'}.`;
  }
  let h=`<div class="insight-card${alerta}"><h4>${alerta?'⚠ Oportunidade / ineficiência operacional':'✔ Diagnóstico de crescimento'}</h4><p>${texto}</p></div>`;
  return h;

/* ---------- semáforo da Visão Geral (Saúde do Negócio) ----------
   Seis frases, cada uma com uma bolinha verde/laranja/vermelha, calculadas com o que já existe
   nas outras abas. Clicar leva para a aba de origem. */
function semaforo(t0,t1){
  const G='#2f7d4f',Y='#b45309',R='#b42318',it=[];
  const pc=(a,b)=>a?(b-a)/a*100:0,pf=v=>fD1.format(Math.abs(v))+'%',mil=v=>'R$ '+(Math.abs(v)>=1e6?fD2.format(v/1e6)+' mi':fCmp.format(v));
  // 1. faturamento do ano
  const vf=pc(t1.f,t0.f);
  it.push({c:vf>=-2?G:vf>=-10?Y:R,t:Math.abs(vf)<2?`Faturamento do ano igual ao de ${uy-1}`:vf>0?`Faturamento do ano ${pf(vf)} acima de ${uy-1}`:`Faturamento do ano ${pf(vf)} abaixo de ${uy-1}`,s:`${mil(t0.f)} · ${delta(t1.f,t0.f)}`,go:'saude'});
  // 2. pacientes x ticket
  const vr=pc(t1.r,t0.r),vt=pc(tk(t1),tk(t0));
  it.push({c:vr>=-3?G:(vf>=-2||vr>=-10)?Y:R,t:vr<-3&&vt>3?'Menos pacientes, cada um gastando mais':vr<-3?'Menos pacientes do que no ano passado':vr>3?'Mais pacientes do que no ano passado':'Mesmo número de pacientes do ano passado',s:`${fNum.format(t0.r)} atendimentos (${delta(t1.r,t0.r)}) · ticket ${fBRL.format(tk(t0))} (${delta(tk(t1),tk(t0))})`,go:'saude'});
  // 3. projeção do mês x mês anterior
  try{const dd=dims(),mesIni=`${uy}-${pad(um)}-01`,acum=agg(maskRange(mesIni,ULT),dd,null).tot;
    let ua=0,ur=0;for(let d=1;d<=ULTDOM;d++)if(wdOf(`${uy}-${pad(um)}-${pad(d)}`)!==0)ua++;const nd=new Date(uy,um,0).getDate();for(let d=ULTDOM+1;d<=nd;d++)if(wdOf(`${uy}-${pad(um)}-${pad(d)}`)!==0)ur++;
    const proj=acum.f+(ua?acum.f/ua:0)*ur,[ay,am]=addMonths(uy,um,-1),antF=agg(maskRange(`${ay}-${pad(am)}-01`,`${ay}-${pad(am)}-${pad(new Date(ay,am,0).getDate())}`),dd,null).tot.f;
    const v=pc(antF,proj),nomeAnt=MESL[am-1].toLowerCase(),nomeAt=MESL[um-1];
    it.push({c:v>=-5?G:v>=-15?Y:R,t:ULTDOM<5?`${nomeAt} recém começou`:Math.abs(v)<5?`${nomeAt} vai fechar perto de ${nomeAnt}`:v>0?`${nomeAt} vai fechar ${pf(v)} acima de ${nomeAnt}`:`${nomeAt} vai fechar ${pf(v)} abaixo de ${nomeAnt}`,s:`projeção ${mil(proj)} · ${nomeAnt} ${mil(antF)}`,go:'geral'});}catch(e){}
  // 4. contas vencidas
  if(D.financeiro&&D.financeiro.resumo&&D.financeiro.resumo.vencidas){const v=D.financeiro.resumo.vencidas;
    it.push({c:!v.n?G:v.v>=10000?R:Y,t:v.n?`${fNum.format(v.n)} conta${v.n===1?'':'s'} vencida${v.n===1?'':'s'} · ${mil(v.v)}`:'Nenhuma conta vencida',s:v.n?'ver quais em Financeiro':'contas a pagar em dia',go:'finGeral'});}
  // 5. médicos
  try{const M=medAlertasCalc(),n=M.sumidos.length,k=M.caindo.length;
    it.push({c:n?(n>=3?R:Y):k?Y:G,t:n?`${n} médico${n===1?'':'s'} ${n===1?'parou':'pararam'} de pedir exames`:k?`${k} médico${k===1?'':'s'} pedindo bem menos`:'Nenhum médico sumiu',s:n&&k?`e ${k} ${k===1?'está':'estão'} pedindo bem menos`:`${fNum.format(M.ativos)} médicos ativos · ${M.novos} novos`,go:'medalertas'});}catch(e){}
  // 6. entrega no prazo + pacientes novos
  try{const ms=D.tempoEntrega?tatMesesFechados():[];let p=null,m=null;
    if(ms.length){m=ms[ms.length-1];let q=0,np=0;tatAgg([m],()=>0).forEach(o=>{q+=o.q;np+=o.np;});p=q?np/q*100:null;}
    let pn=null;if(D.pacientes){const L=D.pacientes.linhas.filter(l=>l[1]===0&&l[0]<ULT.slice(0,7)).sort((a,b)=>a[0]<b[0]?1:-1)[0];if(L&&L[2])pn=L[3]/L[2]*100;}
    if(p!=null)it.push({c:p>=95?G:p>=85?Y:R,t:`${fD1.format(p)}% dos exames entregues no prazo`,s:`${MESL[+m.slice(5)-1].toLowerCase()}${pn!=null?` · ${fD1.format(pn)}% dos pacientes eram novos`:''}`,go:'tat'});}catch(e){}
  if(!it.length)return '';
  return `<div class="card semaf-box"><div class="semaf-tit">Como está o laboratório <span class="hint">resumo de tudo · clique num item para ver</span></div>
   <div class="semaf-grid">${it.map(x=>`<button type="button" class="semaf-it" data-go="${x.go}"><span class="semaf-dot" style="background:${x.c}"></span><span><b>${x.t}</b><span class="semaf-s">${x.s}</span></span></button>`).join('')}</div></div>`;
}

    ${kc('Exames',fNum.format(t0.e),t0.e,t1.e,fNum.format,'t-exa')}

  // um bloco por grupo (antes era top 5 + top 10 repetindo os mesmos nomes)
  const bloco=(tit,v,quem,key,extra)=>`<div class="secao-head" style="margin-top:28px"><h2 style="margin:0">${tit}</h2><span class="sub">entre os ${v.pool} maiores ${quem} de ${uy-1} · em cinza, o valor de ${uy-1}</span></div>${extra||''}

  h+=bloco('Convênios',vConv,'convênios','c');
  // médicos que sumiram têm tela própria: saem daqui para não misturar com quem só caiu
  const MA=medAlertasCalc(),sum=new Set(MA.sumidos.map(x=>x.m));
  const zer=vMed.linhas.filter(r=>!sum.has(r.k)&&r.atual.r===0).length;
  vMed.linhas=vMed.linhas.filter(r=>!sum.has(r.k)&&r.atual.r>0);
  const avisoMed=(MA.sumidos.length||MA.caindo.length||zer)?`<div class="notice warn" style="margin:10px 0 0"><b>${MA.sumidos.length} médico${MA.sumidos.length===1?'':'s'} ${MA.sumidos.length===1?'parou':'pararam'} de pedir exames</b>${MA.caindo.length?` e ${MA.caindo.length} ${MA.caindo.length===1?'está':'estão'} pedindo bem menos`:''}. ${zer?(zer===1?'Outro 1 não pediu nada este ano. ':`Outros ${zer} não pediram nada este ano. `):''}${MA.sumidos.length||zer?'Quem parou saiu desta lista para não misturar · ':''}<button class="lnk" data-go="medalertas" style="font-weight:700">ver em Médicos (alertas) →</button></div>`:'';
  h+=bloco('Médicos',vMed,'médicos','m',avisoMed);

S.finOrd={key:null,dir:1};
function finTabRows(){
  const F=D.financeiro;
  const rows=F.tabela.map((r,i)=>({...r,_i:i}));
  const key=S.finOrd.key,dir=S.finOrd.dir;
  const cmp={
    f:(a,b)=>(a.f||'').localeCompare(b.f||'','pt-BR'),
    t:(a,b)=>String(a.t).localeCompare(String(b.t),'pt-BR',{numeric:true}),
    v:(a,b)=>a.v<b.v?-1:a.v>b.v?1:0,
    st:(a,b)=>a.d-b.d,
    s:(a,b)=>a.s-b.s,
  };
  if(key&&cmp[key]){
    rows.sort((a,b)=>cmp[key](a,b)*dir);
  }else{
    // padrão: vencendo hoje primeiro, depois as vencidas da maior pra menor quantidade de dias em atraso
    rows.sort((a,b)=>{
      const ga=a.st==='hoje'?0:1,gb=b.st==='hoje'?0:1;
      return ga!==gb?ga-gb:b.d-a.d;
    });
  }
  return rows;
}

function fpDefAte(hojeIso,dias){

  return d.toISOString().slice(0,10);

function fpRows(){
  const F=D.financeiro,st=S.fp.status;
  let rows=[];
  if(st==='aberto'||st==='ambos')rows=rows.concat((F.abertos||[]).map(r=>({...r,st:'aberto'})));
  if(st==='baixado'||st==='ambos')rows=rows.concat((F.baixados||[]).map(r=>({...r,st:'baixado'})));
  rows=rows.filter(r=>r.v);
  const qs=normTxt(S.fp.q).trim();
  if(qs)rows=rows.filter(r=>normTxt(r.f).includes(qs));
  const de=S.fp.de||(S.fp.todos?null:F.hoje);
  const ate=S.fp.ate||(S.fp.todos?null:fpDefAte(F.hoje,15));
  if(de)rows=rows.filter(r=>r.v>=de);
  if(ate)rows=rows.filter(r=>r.v<=ate);
  const key=S.fpOrd.key,dir=S.fpOrd.dir;
  const cmp={
    f:(a,b)=>(a.f||'').localeCompare(b.f||'','pt-BR'),
    t:(a,b)=>String(a.t).localeCompare(String(b.t),'pt-BR',{numeric:true}),
    v:(a,b)=>a.v<b.v?-1:a.v>b.v?1:0,
    st:(a,b)=>(a.st==='baixado'?1:0)-(b.st==='baixado'?1:0),
    s:(a,b)=>a.s-b.s,
  };
  if(key&&cmp[key])rows.sort((a,b)=>cmp[key](a,b)*dir);
  else rows.sort((a,b)=>a.v<b.v?-1:a.v>b.v?1:0);
  return rows;
}

// mesmo estilo do gráfico "Faturamento líquido por mês" (visão Saúde do Negócio), mas com
// o valor de títulos baixados (pagos) por mês em vez de faturamento - últimos 12 meses
// com dado, terminando no mês de hoje
function titulosPagosPorMesHTML(F){
  const baixados=(F.baixados||[]).filter(r=>r.v);
  if(!baixados.length)return '';
  const [Yh,Mh]=F.hoje.split('-').map(Number);
  const meses=[];
  for(let i=11;i>=0;i--){let mm=Mh-i,yy=Yh;while(mm<=0){mm+=12;yy--;}meses.push(yy+'-'+String(mm).padStart(2,'0'));}
  const porMes=new Map(meses.map(m=>[m,0]));
  baixados.forEach(r=>{const ym=r.v.slice(0,7);if(porMes.has(ym))porMes.set(ym,porMes.get(ym)+r.s);});
  const mesLbl=ym=>{const [y,m]=ym.split('-').map(Number);return MES[m-1]+'/'+String(y).slice(2);};
  return `<h2 style="margin-top:28px">Títulos pagos por mês<small>últimos 12 meses</small></h2>
  <div class="card">${chartLine({labels:meses.map(mesLbl),series:[{name:'Títulos pagos',color:'#1f9d6b',values:meses.map(m=>porMes.get(m))}],area:true,vals:true,axis:v=>'R$ '+fCmp.format(v),tip:v=>fBRL.format(v),fmtVal:v=>fCmp.format(v),aria:'Títulos pagos por mês'})}</div>`;
}

S.fr={todos:false,status:'aberto',tipo:'todos',de:'',ate:'',q:''};
S.frOrd={key:null,dir:1};
function frRows(){
  const R=D.financeiro.receber,st=S.fr.status;
  let rows=[];
  if(st==='aberto'||st==='ambos')rows=rows.concat((R.abertos||[]).map(r=>({...r,st:'aberto'})));
  if(st==='baixado'||st==='ambos')rows=rows.concat((R.baixados||[]).map(r=>({...r,st:'baixado'})));
  rows=rows.filter(r=>r.v);
  if(S.fr.tipo!=='todos')rows=rows.filter(r=>r.tp===S.fr.tipo);
  const qs=normTxt(S.fr.q).trim();
  if(qs)rows=rows.filter(r=>normTxt(r.f).includes(qs));
  const de=S.fr.de||(S.fr.todos?null:D.financeiro.hoje);
  const ate=S.fr.ate||(S.fr.todos?null:fpDefAte(D.financeiro.hoje,15));
  if(de)rows=rows.filter(r=>r.v>=de);
  if(ate)rows=rows.filter(r=>r.v<=ate);
  const key=S.frOrd.key,dir=S.frOrd.dir;
  const cmp={
    f:(a,b)=>(a.f||'').localeCompare(b.f||'','pt-BR'),
    t:(a,b)=>String(a.t).localeCompare(String(b.t),'pt-BR',{numeric:true}),
    v:(a,b)=>a.v<b.v?-1:a.v>b.v?1:0,
    st:(a,b)=>(a.st==='baixado'?1:0)-(b.st==='baixado'?1:0),
    s:(a,b)=>a.s-b.s,
  };
  if(key&&cmp[key])rows.sort((a,b)=>cmp[key](a,b)*dir);
  else rows.sort((a,b)=>a.v<b.v?-1:a.v>b.v?1:0);
  return rows;
}
function frTh(key,label,cls){
  const ord=S.frOrd.key,dir=S.frOrd.dir;
  const seta=ord===key?(dir>0?' ▲':' ▼'):'';
  return `<th class="${cls||''}" data-fr-ord="${key}" style="cursor:pointer" aria-sort="${ord===key?(dir>0?'ascending':'descending'):'none'}">${label}${seta}</th>`;
}

const NI_SEQ=['#eef4fc','#cde2fb','#9ec5f4','#6da7ec','#3987e5','#2a78d6','#184f95','#0d366b'];
function niMatrizHTML(EM,opts){
  if(!EM||!EM.meses.length)return '';
  opts=opts||{};
  const titulo=opts.titulo||'Convênios não integrados';
  const wrapId=opts.wrapId||'niMatrizWrap';
  const seq=opts.seq||NI_SEQ;
  const linhasTop=EM.linhasTop||EM.linhas||[];
  const linhasOutros=EM.linhasOutros||[];
  const outrosResumo=EM.outrosResumo||null;
  const max=Math.max(1,...linhasTop.concat(linhasOutros).flatMap(l=>l.valores));
  const mesLbl=ym=>{const [y,m]=ym.split('-').map(Number);return MES[m-1]+'/'+String(y).slice(2);};
  const cel=v=>{
    if(!v)return '<td></td>';
    const idx=Math.max(1,Math.round(Math.min(1,v/max)*(seq.length-1)));
    return `<td class="cel" style="background:${seq[idx]};color:${idx>=5?'#fff':'inherit'}" title="${fBRL.format(v)}">${fBRL0.format(v)}</td>`;
  };
  // mês mais recente primeiro (mais fácil ver o que ficou parado agora), Total logo depois do
  // convênio, também fixo, pra sempre ter o número que mais importa visível mesmo rolando
  const idxRev=EM.meses.map((_,i)=>i).reverse();
  const linhaHTML=l=>`<tr><td>${esc(l.convenio)}</td><td>${fBRL0.format(l.total)}</td>${idxRev.map(i=>cel(l.valores[i])).join('')}</tr>`;
  // linha "Outros convênios (N)" clicável: por padrão mostra o resumo agregado; ao
  // clicar, expande e mostra cada um dos N convênios individualmente (e pode recolher
  // de novo clicando de novo)
  const outrosHTML=outrosResumo?`<tbody class="ni-outros-resumo-wrap"><tr class="ni-outros-resumo" style="cursor:pointer"><td>▶ ${esc(outrosResumo.convenio)}</td><td>${fBRL0.format(outrosResumo.total)}</td>${idxRev.map(i=>cel(outrosResumo.valores[i])).join('')}</tr></tbody>
   <tbody class="ni-outros-detalhe" hidden>${linhasOutros.map(linhaHTML).join('')}</tbody>`:'';
  return `<h2 style="margin-top:0">${esc(titulo)}</h2>
  <div class="card tw" id="${wrapId}">
   <table class="ni-heat"><thead><tr><th>Convênio</th><th>Total</th>${idxRev.map(i=>`<th>${mesLbl(EM.meses[i])}</th>`).join('')}</tr></thead><tbody>
   ${linhasTop.map(linhaHTML).join('')}
   </tbody>${outrosHTML}<tbody class="ni-heat-totais">
   <tr><td>Total</td><td>${fBRL0.format(EM.totalGeral)}</td>${idxRev.map(i=>{const v=EM.totalMes[i];return `<td>${v?fBRL0.format(v):''}</td>`;}).join('')}</tr>
   <tr><td>% do total</td><td>100%</td>${idxRev.map(i=>{const v=EM.totalMes[i];return `<td>${v?fD1.format(100*v/EM.totalGeral)+'%':''}</td>`;}).join('')}</tr>
   </tbody></table>
  </div>
  <p class="sub" style="margin:8px 0 24px">Cada célula é o valor faturado naquele mês que nunca virou título · quanto mais escuro, maior o valor parado · arraste a tabela pros lados pra ver os meses mais antigos${outrosResumo?' · clique em "Outros convênios" pra ver cada um':''}.</p>`;
}

/* ---------- financeiro: DRE (sub-aba) ---------- */
S.dre={escopo:'geral',mes:''};
function dreEscopos(DRE){
  // "geral" (tudo, incluindo o posto 100 - hub administrativo/rateio) primeiro, depois só
  // os postos individuais que o backend gera (DRE.postos já vem filtrado pros 7 que o
  // Claudio acompanhava separadamente - os demais entram no Geral mas não tem DRE
  // próprio). O "Consolidado" (só os postos 01-13, sem o 100) saiu da seleção a pedido
  // do Leo - o backend ainda calcula (DRE.consolidado), só não aparece mais aqui.
  return [['geral','Geral'], ...DRE.postos.map(p=>[p,nomeFilial(p)])];
}
function dreDados(DRE,escopo){
  if(escopo==='geral')return DRE.geral;
  if(escopo==='consolidado')return DRE.consolidado;
  return DRE.porPosto[escopo]||{};
}
function dreHierarquiaDoMes(DRE){
  const dados=dreDados(DRE,S.dre.escopo);
  const mes=S.dre.mes||DRE.meses[DRE.meses.length-1];
  return {mes,blocos:dados[mes]||[]};
}
const dreCor=v=>v>=0?'var(--green)':'var(--red)';
// Cores de fundo neutras (nunca por sinal) - só diferenciam o nível da hierarquia, do
// mais escuro (totais/fórmulas) pro mais claro (contas-folha), igual pedido pelo Leo
// ("não gostei do fundo vermelho... cores suaves, azul clarinho / cinza claro").
const DRE_AZUL='#eaf1fb', DRE_AZUL2='#f4f8fd', DRE_CINZA='#f3f4f6', DRE_CINZA2='#f9fafb';
function dreFundoGrupo(nivel){ return nivel===0?DRE_AZUL:DRE_CINZA; }
function dreFundoLinha(nivel){ return nivel%2===0?DRE_CINZA2:'#fff'; }
function dreLinhaHTML(item,nivel,mostrarPosto){
  // A conta "Receita Movimento Diário" (ver _hierarquia_dre no backend) é um agregado da
  // base de exames, sem título/lançamento individual pra abrir - mostra sem seta e sem
  // "0 lançamento(s)", que ficaria confuso.
  const semDrill=item.lancamentos.length===0;
  if(semDrill){
    return `<tbody class="dre-linha-wrap"><tr style="background:${dreFundoLinha(nivel)}"><td style="padding-left:${10+nivel*18}px">${esc(item.nome)}</td><td style="color:#94a3b8;font-size:13px">agregado da base de exames</td><td class="num" style="color:${dreCor(item.tipoDre==='R'?1:-1)}">${fBRL.format(item.valor)}</td></tr></tbody>`;
  }
  const id='dre_'+item.nome.replace(/[^a-z0-9]/gi,'_')+'_'+Math.random().toString(36).slice(2,7);
  // Normalmente uma conta "D" (despesa) guarda sempre o valor em módulo (positivo) e uma
  // "R" (receita) também - a cor segue só o tipo. Mas contas com "regra_especial: sinal"
  // no mapa_dre.json (ex.: Crédito Rotativo) podem jogar uma mesma categoria "R" ora na
  // conta positiva (entrada) ora na negativa (amortização, valor negativo) - nesse caso
  // o sinal de verdade tem que vencer, senão uma saída de dinheiro aparece em verde.
  const sinal=item.tipoDre==='D'?-1:(item.valor>=0?1:-1);

function dreBlocoHTML(bloco,nivel,mostrarPosto){
  if(bloco.tipo==='formula'){
    return `<tbody class="dre-formula"><tr style="background:${DRE_AZUL2};border-top:1px solid #cfdaee;border-bottom:1px solid #cfdaee"><td colspan="2" style="font-weight:700;padding:10px 8px 10px ${10+nivel*18}px">${esc(bloco.nome)}</td><td class="num" style="font-weight:700;color:${dreCor(bloco.valor)}">${fBRL.format(bloco.valor)}</td></tr></tbody>`;
  }

  bloco.contas.forEach(item=>{
    h+=item.tipo==='grupo'?dreBlocoHTML(item,nivel+1,mostrarPosto):dreLinhaHTML(item,nivel+1,mostrarPosto);
  });
  return h;

function dreFlatten(blocos,nivel){
  let linhas=[];
  blocos.forEach(b=>{
    if(b.tipo==='formula'){
      linhas.push({nivel,nome:b.nome,tipo:'Fórmula',lanc:'',valor:b.valor});
    }else{
      linhas.push({nivel,nome:b.nome,tipo:'Grupo',lanc:'',valor:b.valor});
      b.contas.forEach(item=>{
        if(item.tipo==='grupo')linhas=linhas.concat(dreFlatten([item],nivel+1));
        else linhas.push({nivel:nivel+1,nome:item.nome,tipo:'Conta',lanc:item.lancamentos.length,valor:item.valor});
      });
    }
  });
  return linhas;
}

/* ---------- laboratório de apoio ---------- */
const normTxt=s=>String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
S.ap={q:'',f:'todos',ord:null,dir:1,pg:0,ex:false};
const AP_PAGE=50;
S.pc={q:'',conv:'1',ativos:true,ord:null,dir:1,pg:0,ref:'min',neg:false};  /* conv 1 = Particular */
const PC_PAGE=50;
const AP_F=[['todos','Todos os exames'],['ambos','Com os dois preços'],['d','DB mais barato'],['h','HP mais barato'],['=','Preços iguais'],['?','Conferir (mais de um preço)'],['sd','Só o DB tem preço'],['sh','Só o HP tem preço'],['sp','Mapeado, sem preço na tabela'],['nm','Sem mapeamento']];
const apHay=r=>r._h||(r._h=normTxt([r.c,r.n,r.m,r.d&&r.d.c,r.d&&r.d.n,r.h&&r.h.c,r.h&&r.h.n].join(' ')));
const apPreco=o=>o&&o.p?o.p[0]:null;
function apRows(){
  const AP=D.apoio,f=S.ap.f,qs=normTxt(S.ap.q).trim(),tk_=qs.split(/\s+/).filter(Boolean);
  let rows=AP.rows.filter(r=>S.ap.ex||r.l);
  if(f==='ambos')rows=rows.filter(r=>apPreco(r.d)!=null&&apPreco(r.h)!=null);else if(f!=='todos')rows=rows.filter(r=>r.w===f);
  if(tk_.length)rows=rows.filter(r=>{const h=apHay(r);return tk_.every(t=>h.includes(t));});
  const ord=S.ap.ord||(tk_.length?'rel':'vol'),dir=S.ap.dir;
  const nulo=(a,b,fn)=>a==null&&b==null?0:a==null?1:b==null?-1:fn(a,b);   // sem valor sempre no fim
  const pt=(a,b)=>a.n.localeCompare(b.n,'pt-BR');
  const score=r=>{const n=normTxt(r.n),c=normTxt(r.c);return c===qs?0:n===qs?1:n.startsWith(qs)?2:n.includes(qs)?3:4;};
  const vol=volumeAnoExame();
  rows=rows.slice().sort((a,b)=>{
    if(ord==='rel')return score(a)-score(b)||pt(a,b);
    if(ord==='vol')return ((vol.get(b.c)||0)-(vol.get(a.c)||0))||pt(a,b);
    if(ord==='c')return dir*a.c.localeCompare(b.c,'pt-BR')||pt(a,b);
    if(ord==='pd')return nulo(apPreco(a.d),apPreco(b.d),(x,y)=>dir*(x-y))||pt(a,b);
    if(ord==='ph')return nulo(apPreco(a.h),apPreco(b.h),(x,y)=>dir*(x-y))||pt(a,b);
    if(ord==='x')return nulo(a.x,b.x,(x,y)=>dir*(x-y))||pt(a,b);
    return dir*pt(a,b);
  });
  return rows;
}

}

  h+=`<div class="card tw"><table class="aptb ap-tab"><thead><tr>${th('c','Cód.','cd')}${th('n','Exame','nm')}${th('pd','<span style="color:var(--c-db)">Preço DB</span>','pc')}${th('ph','<span style="color:var(--c-hp)">Preço HP</span>','pc')}${th('x','Mais barato','pc st')}</tr></thead><tbody>`;
  vis.forEach(r=>{
    const mt=(r.m?'Material: '+esc(r.m):'')+(r.l?'':(r.m?' · ':'')+'<span class="tag w" style="margin-left:0" title="Este exame não está na lista de apoio do CONCENT">fora da lista de apoio</span>');
    h+=`<tr><td class="cd" data-l="Cód.">${esc(r.c)}</td><td class="nm">${esc(r.n)}${mt?`<span class="mt">${mt}</span>`:''}</td>
     <td data-l="Preço DB" class="pc${r.w==='d'?' best':''}">${apCel(r.d,r.w==='d','d')}</td><td data-l="Preço HP" class="pc${r.w==='h'?' best':''}">${apCel(r.h,r.w==='h','h')}</td><td data-l="Mais em conta" class="pc st">${apStatus(r)}</td></tr>`;

function pcRows(){
  const PC=D.precosConv; if(!PC)return [];
  const q=normTxt(S.pc.q).trim(), conv=S.pc.conv;
  const out=[];
  for(const [ei,ci,ativo,valor] of PC.linhas){
    if(S.pc.ativos && !ativo) continue;
    const cv=PC.convenios[ci];
    if(conv && String(cv.c)!==conv) continue;
    const nome=PC.exames[ei];
    if(q && !normTxt(nome).includes(q)) continue;
    const cDB=PC.custoDB[ei], cHP=PC.custoHP[ei];
    const custo=S.pc.ref==='db'?(cDB==null?null:cDB):S.pc.ref==='hp'?(cHP==null?null:cHP):
      ([cDB,cHP].filter(v=>v!=null).length?Math.min(...[cDB,cHP].filter(v=>v!=null)):null);
    let dif=null,marg=null;
    if(custo!=null && valor>0){ dif=valor-custo; marg=dif/valor*100; }
    if(S.pc.neg && !(marg!=null && marg<0)) continue;
    out.push({ei,cod:PC.exameCod[ei],nome,cv,ativo,valor,cDB,cHP,dif,marg});
  }
  const ord=S.pc.ord,dir=S.pc.dir||1,vol=volumeAnoExame();
  if(ord){
    const key={cod:r=>r.cod,exame:r=>normTxt(r.nome),conv:r=>normTxt(r.cv.n),valor:r=>r.valor,db:r=>r.cDB==null?-1:r.cDB,hp:r=>r.cHP==null?-1:r.cHP,marg:r=>r.marg==null?-1e9:r.marg}[ord];
    if(key) out.sort((a,b)=>{const x=key(a),y=key(b);return x<y?-dir:x>y?dir:0;});
    return out;
  }
  if(!q.trim()){
    // padrão: ordenado pelos exames mais feitos no ano (clique em "Exame" pra ir para ordem alfabética);
    // sem limite de 50 - a paginação normal já deixa ver o restante, página a página
    out.sort((a,b)=>(vol.get(PC.exameCod[b.ei])||0)-(vol.get(PC.exameCod[a.ei])||0));
    return out;
  }
  out.sort((a,b)=>normTxt(a.nome)<normTxt(b.nome)?-1:normTxt(a.nome)>normTxt(b.nome)?1:(a.marg==null?1:0)-(b.marg==null?1:0));
  return out;
}
function prejuizoApoio12m(PC){
  const B=D.B,ymFim=mesYM[mesYM.length-1],qtd=new Map(),idConv=D.convenios.map(c=>c.id);
  for(let i=0;i<B.mo.length;i++){
    if(mesYM[B.mo[i]]<=ymFim-12)continue;
    const ex=D.exames[B.x[i]],st=D.setores[ex.s];
    if(!st||!normTxt(st.nome).includes('laboratorio apoio'))continue;
    const kq=ex.cod+'|'+idConv[B.c[i]];qtd.set(kq,(qtd.get(kq)||0)+B.e[i]);
  }
  let perda=0,exames=0;const porConv=new Map();
  for(const [ei,ci,ativo,valor] of PC.linhas){
    if(!ativo||!(valor>0))continue;
    const cs=[PC.custoDB[ei],PC.custoHP[ei]].filter(v=>v!=null);if(!cs.length)continue;
    const custo=Math.min(...cs);if(valor>=custo)continue;
    const cv=PC.convenios[ci],q=qtd.get(PC.exameCod[ei]+'|'+cv.c)||0;if(!q)continue;
    const p=q*(custo-valor);perda+=p;exames+=q;porConv.set(cv.n,(porConv.get(cv.n)||0)+p);
  }
  const top=[...porConv.entries()].sort((a,b)=>b[1]-a[1])[0];
  return {perda,exames,top:top&&perda?{nome:top[0],pct:top[1]/perda*100}:null};
}

  const L=mgLimites(),volta=m=>{const d=new Date(ULT+'T12:00:00');d.setMonth(d.getMonth()-m);d.setDate(d.getDate()+1);return atISO(d);};
  let ini,fim=ULT;
  if(S.mg.per==='12m')ini=volta(12);else if(S.mg.per==='6m')ini=volta(6);else if(S.mg.per==='3m')ini=volta(3);
  else if(S.mg.per==='mes')ini=ULT.slice(0,8)+'01';else if(S.mg.per==='ano')ini=ULT.slice(0,5)+'01-01';
  else{ini=S.mg.de||volta(12);fim=S.mg.ate||ULT;}
  if(ini<L.min)ini=L.min;if(fim>L.max)fim=L.max;if(fim<ini)fim=ini;
  return {ini,fim};
}
function mgCustos(tab){
  const PC=D.precosConv,m=new Map();
  PC.exameCod.forEach((cod,i)=>{const db=PC.custoDB[i],hp=PC.custoHP[i];let v=null,de='',fb=false;
    if(tab==='DB'){if(db!=null){v=db;de='DB';}else if(hp!=null){v=hp;de='HP';fb=true;}}
    else if(tab==='HP'){if(hp!=null){v=hp;de='HP';}else if(db!=null){v=db;de='DB';fb=true;}}
    else{if(db!=null&&(hp==null||db<=hp)){v=db;de='DB';}else if(hp!=null){v=hp;de='HP';}}
    if(v!=null)m.set(cod,{v,de,fb});});
  return m;
}
function mgCalc(){
  const {ini,fim}=mgPeriodo(),PC=D.precosConv,cus=mgCustos(S.mg.tab),AP=D.AP;
  let i0=0;while(i0<NDIAS&&D.dias[i0]<ini)i0++;let i1=NDIAS-1;while(i1>0&&D.dias[i1]>fim)i1--;
  const porC=new Map(),qtd=new Map(),T={q:0,fat:0,custo:0,qSem:0,qFb:0};
  for(let i=0;i<AP.d.length;i++){
    const d=AP.d[i];if(d<i0||d>i1)continue;
    const cv=D.convenios[AP.c[i]],ex=D.exames[AP.x[i]],q=AP.e[i],l=AP.l[i];
    let o=porC.get(cv.id);if(!o){o={id:cv.id,nome:cv.nome,q:0,fat:0,custo:0,prej:0,exprej:0,piores:[]};porC.set(cv.id,o);}
    o.q+=q;o.fat+=l;T.q+=q;T.fat+=l;
    const c=cus.get(ex.cod);
    if(c){o.custo+=q*c.v;T.custo+=q*c.v;if(c.fb)T.qFb+=q;}else T.qSem+=q;
    const k=ex.cod+'|'+cv.id;qtd.set(k,(qtd.get(k)||0)+q);
  }
  T.prej=0;T.exprej=0;
  for(const [ei,ci,ativo,valor] of PC.linhas){
    if(!ativo||!(valor>0))continue;
    const cod=PC.exameCod[ei],c=cus.get(cod);if(!c||valor>=c.v)continue;
    const cv=PC.convenios[ci];if(normTxt(cv.n).includes('cortesia'))continue;
    const q=qtd.get(cod+'|'+cv.c)||0;if(!q)continue;
    const o=porC.get(cv.c);if(!o)continue;
    const p=q*(c.v-valor);o.prej+=p;o.exprej+=q;T.prej+=p;T.exprej+=q;
    o.piores.push({nome:PC.exames[ei],q,valor,custo:c.v,de:c.de,p});
  }
  const rows=[...porC.values()].map(o=>(o.sobra=o.fat-o.custo,o)).sort((a,b)=>b.fat-a.fat);
  rows.forEach(o=>o.piores.sort((a,b)=>b.p-a.p));
  T.sobra=T.fat-T.custo;
  return {ini,fim,rows,T};
}
