yaml
name: Atualizar Dashboard

on:
  push:
    paths:
      - "data/**"
      - "template.html"
      - "gerar_dashboard.py"
      - "cripto_arquivos.py"
      - "requirements.txt"
      - ".github/workflows/atualizar.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar index.html
        env:
          DASHBOARD_SENHA: ${{ secrets.DASHBOARD_SENHA }}
        run: python gerar_dashboard.py

      - name: Montar o site
        run: |
          mkdir _site
          cp index.html _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  publicar:
    needs: gerar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
